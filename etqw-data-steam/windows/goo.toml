# GooGet (Windows) package for etqw-data-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "etqw-data-steam"
version = "0"
release = 2
arch = "noarch"
description = "Enemy Territory: Quake Wars data via Steam"
license = "LicenseRef-Proprietary"
url = "https://steamdb.info/app/10000/"
release_notes = ["Generated from package.toml; non-interactive Steam download via STEAM_USER or tools/fetch-steam"]
provides = ["etqw-data"]
conflicts = []
replaces = []

[deps]

[files]
"etqw" = "<SystemDrive>/Games/etqw"

[stage]
container = "fedora"
source_dir = "etqw-data-steam"
deps = ["desktop-file-utils"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/etqw"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/etqw/." "$STAGE/etqw/"
rm -f "$STAGE/etqw/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
