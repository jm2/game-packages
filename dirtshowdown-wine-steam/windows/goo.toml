# GooGet (Windows) package for dirtshowdown-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "dirtshowdown-steam"
version = "0"
release = 4
arch = "noarch"
description = "DiRT Showdown using Wine with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://steamdb.info/app/201700/"
release_notes = ["Link Goldberg from /opt/gbe-fork so the game starts under umu/Proton"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"dirtshowdown" = "<SystemDrive>/Games/dirtshowdown"

[[shortcut]]
name = "DiRT Showdown"
target = "dirtshowdown/showdown_avx.exe"
args = ""
description = "DiRT Showdown (Wine)"

[[shortcut]]
name = "DiRT Showdown (non-AVX build for older CPUs)"
target = "dirtshowdown/showdown.exe"
args = ""
description = "DiRT Showdown (Wine)"

[[firewall]]
name = "DiRT Showdown (showdown_avx.exe)"
program = "dirtshowdown/showdown_avx.exe"

[[firewall]]
name = "DiRT Showdown (showdown.exe)"
program = "dirtshowdown/showdown.exe"

[[source]]
name = "showdown.exe"
url = "https://github.com/jm2/archlinux-package-dirtshowdown-wine-steam/raw/master/showdown.exe"
sha256 = "80b9b3bc95f2e1a3c1f8a183c32bb911f1dbbb662f4e09071c0f6d70b536a9e2"

[[source]]
name = "showdown_avx.exe"
url = "https://github.com/jm2/archlinux-package-dirtshowdown-wine-steam/raw/master/showdown_avx.exe"
sha256 = "a62e1cb44020951d38ee4ab3c49a25fe76c77d9defd42661b81292d9ce495b7f"

[stage]
container = "fedora"
source_dir = "dirtshowdown-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin"]
local = ["gbe-fork-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/dirtshowdown"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/dirtshowdown/." "$STAGE/dirtshowdown/"
rm -f "$STAGE/dirtshowdown/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
