# GooGet (Windows) package for doom3bfg-data-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "doom3bfg-data-gog"
version = "1"
release = 4
arch = "noarch"
description = "Doom 3 BFG Edition data via GOG"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/game/doom_3_bfg_edition"
release_notes = ["Built from linux-packages doom3bfg-data-gog 1-4"]
provides = ["doom3bfg-data"]
conflicts = ["doom3bfg-data-steam"]
replaces = []

[deps]

[files]
"doom3bfg" = "<ProgramFiles>/Games/doom3bfg"

[stage]
container = "fedora"
source_dir = "doom3bfg-data-gog"
deps = ["desktop-file-utils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/doom3bfg"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/usr/share/games/doom3bfg/." "$STAGE/doom3bfg/"
rm -f "$STAGE/doom3bfg/.gamelaunch-stamp"
'''
