# GooGet (Windows) package for quake4-data-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "quake4-data-gog"
version = "1"
release = 5
arch = "noarch"
description = "Quake 4 data via GOG"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/game/quake_4"
release_notes = ["Built from linux-packages quake4-data-gog 1-5"]
provides = ["quake4-data"]
conflicts = ["quake4-data-steam"]
replaces = []

[deps]

[files]
"quake4" = "<ProgramFiles>/Games/quake4"

[[shortcut]]
name = "Quake 4 (openQ4)"
target = "quake4/openQ4-client_x64.exe"
args = ""
description = "Quake 4"
requires = "quake4/openQ4-client_x64.exe"

[stage]
container = "fedora"
source_dir = "quake4-data-gog"
deps = ["desktop-file-utils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/quake4"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/quake4/." "$STAGE/quake4/"
rm -f "$STAGE/quake4/.gamelaunch-stamp"
'''
