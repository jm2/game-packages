# GooGet (Windows) package for flatout2-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "flatout2-steam"
version = "0"
release = 2
arch = "noarch"
description = "FlatOut 2 with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/2990/FlatOut_2/"
release_notes = ["Link Goldberg from /opt/gbe-fork so the game starts under umu/Proton"]
provides = []
conflicts = ["flatout2-gog"]
replaces = []

[deps]

[files]
"flatout2" = "<SystemDrive>/Games/flatout2"

[[shortcut]]
name = "FlatOut 2"
target = "flatout2/FlatOut2.exe"
args = ""
description = "FlatOut 2"

[[firewall]]
name = "FlatOut 2 (FlatOut2.exe)"
program = "flatout2/FlatOut2.exe"

[stage]
container = "fedora"
source_dir = "flatout2-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin"]
local = ["gbe-fork-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/flatout2"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/flatout2/." "$STAGE/flatout2/"
rm -f "$STAGE/flatout2/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
