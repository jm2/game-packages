name = "ut2004-data-gog"
version = "3369"
release = 3
arch = "noarch"
description = "Game data for Unreal Tournament 2004: Editor's Choice Edition, extracted from\nthe GOG installer you download yourself and installed to /opt/ut2004. Play it\nwith the native OldUnreal binaries from ut2004-bin."
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/game/unreal_tournament_2004_ece"
release_notes = ["Built from linux-packages ut2004-data-gog 3369-3"]
provides = ["ut2004-data"]
conflicts = ["ut2004-data", "ut2004-gog"]
replaces = []

[deps]

[files]
"ut2004" = "<ProgramFiles>/Games/ut2004"

[stage]
container = "fedora"
source_dir = "ut2004-data-gog"
deps = ["desktop-file-utils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/ut2004"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/ut2004/." "$STAGE/ut2004/"
rm -f "$STAGE/ut2004/.gamelaunch-stamp"
'''
