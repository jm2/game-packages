name = "cod4-data-steam"
version = "0"
release = 2
arch = "noarch"
description = "Call of Duty 4: Modern Warfare game data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/7940/Call_of_Duty_4_Modern_Warfare/"
release_notes = ["Built from linux-packages cod4-data-steam 0-2"]
provides = ["cod4-data"]
conflicts = []
replaces = []

[deps]

[files]
"cod4" = "<ProgramFiles>/Games/cod4"

[stage]
container = "fedora"
source_dir = "cod4-data-steam"
deps = ["desktop-file-utils", "python3"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/cod4"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/cod4/." "$STAGE/cod4/"
rm -f "$STAGE/cod4/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
