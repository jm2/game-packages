name = "ut2004-data-steam"
version = "0"
release = 5
arch = "noarch"
description = "Game data for Unreal Tournament 2004: Editor's Choice Edition, downloaded from\nSteam with steamcmd and installed to C:\\Program Files\\Games\\ut2004. Play it\nwith ut2004-bin."
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/13230/Unreal_Tournament_2004_Editors_Choice_Edition/"
release_notes = ["Built from linux-packages ut2004-data-steam 0-5"]
provides = ["ut2004-data"]
conflicts = ["ut2004-data-archiveorg", "ut2004-data-gog"]
replaces = []

[deps]

[files]
"ut2004" = "<ProgramFiles>/Games/ut2004"

[[shortcut]]
name = "Unreal Tournament 2004 (OldUnreal)"
target = "ut2004/System/UT2004.exe"
args = ""
description = "Unreal Tournament 2004: Editor's Choice Edition"
requires = "ut2004/System/UT2004.exe"

[stage]
container = "fedora"
source_dir = "ut2004-data-steam"
deps = ["desktop-file-utils", "python3"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/ut2004"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/ut2004/." "$STAGE/ut2004/"
rm -f "$STAGE/ut2004/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
