# GooGet (Windows) package for wreckfest-wine-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "wreckfest-gog"
version = "1.0o"
release = 5
arch = "noarch"
description = "Wreckfest with data via GOG"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/en/game/wreckfest"
release_notes = ["Built from linux-packages wreckfest-wine-gog 1.0o-5"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"wreckfest-gog" = "<SystemDrive>/Games/wreckfest-gog"

[writable]
dirs = ["wreckfest-gog"]

[[shortcut]]
name = "Wreckfest (GOG)"
target = "wreckfest-gog/Wreckfest_x64.exe"
args = ""
description = "Wreckfest"

[[shortcut]]
name = "Wreckfest (GOG) (legacy 32-bit Wreckfest.exe)"
target = "wreckfest-gog/Wreckfest.exe"
args = ""
description = "Wreckfest"

[[shortcut]]
name = "Wreckfest (GOG) (dedicated LAN server (server_config.cfg))"
target = "wreckfest-gog/Wreckfest_x64.exe"
args = "-s server_config=server_config.cfg"
description = "Wreckfest"

[[firewall]]
name = "Wreckfest (GOG) (Wreckfest_x64.exe)"
program = "wreckfest-gog/Wreckfest_x64.exe"

[[firewall]]
name = "Wreckfest (GOG) (Wreckfest.exe)"
program = "wreckfest-gog/Wreckfest.exe"

[stage]
container = "fedora"
source_dir = "wreckfest-wine-gog"
deps = ["desktop-file-utils", "icoutils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/wreckfest-gog"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/wreckfest-gog/." "$STAGE/wreckfest-gog/"
rm -f "$STAGE/wreckfest-gog/.gamelaunch-stamp"
'''
