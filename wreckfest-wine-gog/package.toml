[icon]
ico = "goggame-*.ico"

[hooks]
post_prepare = """
# The game is at the installer root; app/ holds GOG's icon (and crash/db).
if [ -d app ]; then cp -a app/. .; rm -rf app; fi
rm -rf __redist commonappdata tmp
# Dedicated server bootstrap (as start_server.bat does).
printf '228380\n' > steam_appid.txt
[ -f initial_server_config.cfg ] && cp initial_server_config.cfg server_config.cfg
"""

[launcher]
exe = "Wreckfest_x64.exe"
legacy_dirs = []
wine_user = "hostname"
writable = true
writable_copy = ["server_config.cfg"]
variants = [
  { flag = "m", exe = "Wreckfest_x64.exe", description = "64-bit Wreckfest_x64.exe" },
  { flag = "l", exe = "Wreckfest.exe", description = "legacy 32-bit Wreckfest.exe" },
  { flag = "s", exe = "Wreckfest_x64.exe", args = ["-s", "server_config=server_config.cfg"], description = "dedicated LAN server (server_config.cfg)" },
]
default_variant = "m"

[desktop]
name = "Wreckfest (GOG)"
comment = "Wreckfest (Wine)"
categories = "Game;SportsGame;"
keywords = "racing;derby"

[deps]
recommends_fedora = ["wine"]
