[icon]
ico = "goggame-*.ico"

[hooks]
post_prepare = """
# Newer GOG installers keep the game under app/; flatten it.
if [ -e app/Wreckfest_x64.exe ]; then cp -a app/. .; rm -rf app; fi
rm -rf __redist commonappdata tmp
"""

[launcher]
exe = "Wreckfest_x64.exe"
legacy_dirs = []
variants = [
  { flag = "m", exe = "Wreckfest_x64.exe", description = "64-bit Wreckfest_x64.exe" },
  { flag = "l", exe = "Wreckfest.exe", description = "legacy 32-bit Wreckfest.exe" },
]
default_variant = "m"

[desktop]
name = "Wreckfest (GOG)"
comment = "Wreckfest (Wine)"
categories = "Game;SportsGame;"
keywords = "racing;derby"
