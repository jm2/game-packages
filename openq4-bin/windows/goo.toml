# GooGet (Windows) package; built by tools/goo-build.
name = "openq4-bin"
version = "0.13.2"
release = 2
arch = "x86_64"
description = """
openQ4, the open-source Quake 4 engine and game-code replacement with OpenGL
and experimental Vulkan renderers (upstream's Windows x64 build, plus the
Quake 4 1.4.2 patch paks pak013-pak022 from id Software's point release),
installed next to the Quake 4 data packages in C:\\Program Files\\Games\\quake4.
Configs, saves, caches and logs go to %LOCALAPPDATA%\\openQ4 for each user (the
engine's own default).

Install the game data too: quake4-data-steam or quake4-data-gog.

OpenAL32.dll dynamically links the 64-bit (x64) Microsoft Visual C++ 2015-2022
Redistributable."""
# Engine (GPL-3.0-or-later), game modules (Quake 4 SDK license), 1.4.2 patch
# paks (id Software EULA, Quake4-License.txt) and bundled OpenAL Soft
# (LGPL-2.1-or-later).
license = "GPL-3.0-or-later AND LicenseRef-Quake4-SDK AND LicenseRef-Quake4-EULA AND LGPL-2.1-or-later"
url = "https://github.com/themuffinator/openQ4"
release_notes = ["Initial GooGet package (upstream 0.13.2 Windows x64 build + Quake 4 1.4.2 patch paks)", "Windows on ARM: native arm64 build alongside x86_64 (googet prefers it there)"]

# Same directory as quake4-data-gog and quake4-data-steam, which install only
# q4base/pak001-pak012.pk4 and q4base/zpak*h.pk4; this package adds baseoq4/
# and the 1.4.2 patch paks (pak013-pak022, q4cmp_pak001, zpak_english_01-04) in
# q4base/, so no files overlap.
[files]
"quake4" = "<ProgramFiles>/Games/quake4"

[[shortcut]]
name = "Quake 4 (openQ4)"
# Sys_DefaultBasePath() uses the executable's directory (where both baseoq4/
# and q4base/ live) and Sys_DefaultSavePath() uses %LOCALAPPDATA%\openQ4, so no
# path arguments are needed.
target = "quake4/openQ4-client_x64.exe"
args = ""
description = "Quake 4"
# The data packages create this when installed after openq4-bin.
requires = "quake4/q4base/pak001.pk4"

[[firewall]]
name = "openQ4"
program = "quake4/openQ4-client_x64.exe"

[[firewall]]
name = "openQ4 dedicated server"
program = "quake4/openQ4-ded_x64.exe"

[[source]]
name = "openq4-0.13.2-windows-x64.zip"
url = "https://github.com/themuffinator/openQ4/releases/download/v0.13.2/openq4-0.13.2-windows-x64.zip"
sha256 = "9786b3fc2fc4eed91d4b534084b3559ccd21ac7d7f152ff342645d96c46b2601"

# openQ4 validates pak013.pk4-pak022.pk4 at startup, which quake4-data-* leave
# out; pull them from the same Linux 1.4.2 point release as the PKGBUILD.
[[source]]
name = "quake4-linux-1.4.2.x86.run"
url = "https://aur.slashbunny.com/quake4/quake4-linux-1.4.2.x86.run"
sha256 = "9203b387b1a4075a1b9ad1eb7be32b49a88141a448d9330d9cbe1f40a145bd6a"

[stage]
# $SRC: downloaded sources; $STAGE: the tree [files] maps from.
# Strip the .pdb debug symbols (~163 MB), matching the Linux binary package.
script = '''
mkdir -p "$WORK"
unzip -q -o "$SRC/openq4-0.13.2-windows-x64.zip" -d "$WORK"
sh "$SRC/quake4-linux-1.4.2.x86.run" --noexec --nox11 --target "$WORK/quake4-1.4.2" >/dev/null
z=$WORK/openq4-0.13.2-windows-x64 q4=$WORK/quake4-1.4.2 d=$STAGE/quake4
mkdir -p "$d/baseoq4" "$d/q4base"
cp "$z"/openQ4-client_x64.exe "$z"/openQ4-ded_x64.exe \
    "$z"/renderer-*_x64.dll "$z"/OpenAL32.dll \
    "$z"/VERSION.txt "$z"/LICENSE "$z"/README.html "$d/"
cp -R "$z/docs" "$d/"
cp "$z"/baseoq4/*.dll "$z"/baseoq4/*.pk4 "$z"/baseoq4/mod.json "$d/baseoq4/"
cp "$q4"/q4base/pak0??.pk4 "$q4"/q4base/q4cmp_pak001.pk4 \
    "$q4"/q4base/zpak_english_0?.pk4 "$q4"/us/q4base/*.pk4 "$d/q4base/"
cp "$q4/License.txt" "$d/Quake4-License.txt"
'''
