# GooGet (Windows) package for ut3-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "ut3-steam"
version = "0"
release = 2
arch = "noarch"
description = "Unreal Tournament 3 Black with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/13210/Unreal_Tournament_3_Black/"
release_notes = ["Built from linux-packages ut3-wine-steam 0-2"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"ut3" = "<SystemDrive>/Games/ut3"

[[shortcut]]
name = "Unreal Tournament 3"
target = "ut3/Binaries/UT3.exe"
args = "-nostartupmovies"
description = "Unreal Tournament 3 Black"

[[firewall]]
name = "Unreal Tournament 3 (UT3.exe)"
program = "ut3/Binaries/UT3.exe"

[stage]
container = "fedora"
source_dir = "ut3-wine-steam"
deps = ["desktop-file-utils"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/ut3"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/ut3/." "$STAGE/ut3/"
rm -f "$STAGE/ut3/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
