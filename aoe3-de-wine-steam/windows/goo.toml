# GooGet (Windows) package for aoe3-de-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "aoe3-de-steam"
version = "0"
release = 5
arch = "noarch"
description = "Age of Empires III: Definitive Edition, with the game data downloaded from\nSteam and the Goldberg Steam emulator in place of Steam. ageLANServer's\nlauncher companion DLLs are installed too, so LAN multiplayer lobbies work\nagainst an ageLANServer on the network instead of the official servers."
license = "LicenseRef-Proprietary"
url = "https://steamdb.info/app/933110/"
release_notes = ["Built from linux-packages aoe3-de-wine-steam 0-5"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"aoe3-de" = "<ProgramFiles>/Games/aoe3-de"

[writable]
dirs = ["aoe3-de"]

[[shortcut]]
name = "Age of Empires III: Definitive Edition"
target = "aoe3-de/AoE3DE_s.exe"
args = ""
description = "Age of Empires III: Definitive Edition"

[[firewall]]
name = "Age of Empires III: Definitive Edition (AoE3DE_s.exe)"
program = "aoe3-de/AoE3DE_s.exe"

[stage]
container = "fedora"
source_dir = "aoe3-de-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin", "python3"]
local = ["gbe-fork-bin", "agelanserver-companion-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/aoe3-de"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/aoe3-de/." "$STAGE/aoe3-de/"
rm -f "$STAGE/aoe3-de/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
