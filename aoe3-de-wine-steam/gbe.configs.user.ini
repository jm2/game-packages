[user::general]
# Left unset on purpose so gbe uses your global settings
# (GSE Saves/settings/configs.user.ini in the Wine prefix's AppData/Roaming,
# i.e. ~/.local/share/gamelaunch/<game>/userdata/AppData/Roaming/GSE Saves/settings/):
#   account_name=   your player name
#   account_steamid= leave unset to have one generated
#   language=       one from supported_languages.txt (default english)
#   ip_country=     Alpha-2 country code (default US)
# Saves go to GSE Saves as well (no local_save_path: the install is read-only).
