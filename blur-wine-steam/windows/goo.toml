# GooGet (Windows) package for blur-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "blur-steam"
version = "0"
release = 2
arch = "noarch"
description = "Blur using Wine with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://steamdb.info/app/42640/"
release_notes = ["Switch to gamelaunch (umu/Proton default, system wine fallback)"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"blur" = "<SystemDrive>/Games/blur"

[[shortcut]]
name = "Blur"
target = "blur/Blur.exe"
args = ""
description = "Blur (Wine)"

[[firewall]]
name = "Blur (Blur.exe)"
program = "blur/Blur.exe"

[stage]
container = "fedora"
source_dir = "blur-wine-steam"
deps = ["desktop-file-utils"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/blur"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/blur/." "$STAGE/blur/"
rm -f "$STAGE/blur/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
