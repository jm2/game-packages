name = "eliteforce-data-gog"
family = "data-gog"
version = "1"
release = 4
summary = "Star Trek Voyager: Elite Force data via GOG"
url = "https://www.gog.com/game/star_trek_voyager_elite_force"
target = "/opt/lilium-voyager"
provides = ["eliteforce-data"]
conflicts = []
changelog = ["Generated from package.toml", "Rebuilt without set-group-ID bits on its directories, which made RPM refuse to install it beside its engine package"]

[hooks]
post_prepare = """
mv BaseEF baseEF
"""

[[source.files]]
name = "setup_star_trek_voyagertm_elite_force_1.2_(34378).exe"
url = "gogdownloader://star_trek_voyager_elite_force/en1installer0"
sha256 = "2adb604a8916688689b700a9be3083903d036e1633e1fe675a97776891ac2ae8"
extract = "inno"
copy = ["BaseEF/*.pk3"]

[goo]
# Windows release 4 (= 3 + 1) is above the published 1@3 (new description and
# Lilium Voyager shortcut).
release_offset = 1
description = """
The retail baseEF pak files (pak0.pk3 to pak3.pk3) of Star Trek Voyager: Elite
Force 1.2 from your GOG installer, installed to
C:\\Program Files\\Games\\lilium-voyager\\baseEF. Play Holomatch with
lilium-voyager-git."""

[[goo.shortcut]]
name = "Star Trek Voyager Elite Force (Lilium Voyager)"
target = "lilium-voyager/lilium-voyager.exe"
args = ""
description = "Star Trek Voyager: Elite Force Holomatch"
requires = "lilium-voyager/lilium-voyager.exe"
