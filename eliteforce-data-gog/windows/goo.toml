name = "eliteforce-data-gog"
version = "1"
release = 3
arch = "noarch"
description = "Star Trek Voyager: Elite Force data via GOG"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/game/star_trek_voyager_elite_force"
release_notes = ["Generated from package.toml"]
provides = ["eliteforce-data"]
conflicts = []
replaces = []

[deps]

[files]
"lilium-voyager" = "<SystemDrive>/Games/lilium-voyager"

[stage]
container = "fedora"
source_dir = "eliteforce-data-gog"
deps = ["desktop-file-utils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/lilium-voyager"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/lilium-voyager/." "$STAGE/lilium-voyager/"
rm -f "$STAGE/lilium-voyager/.gamelaunch-stamp"
'''
