# GooGet (Windows) package for eliteforce-data-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "eliteforce-data-gog"
version = "1"
release = 4
arch = "noarch"
description = "The retail baseEF pak files (pak0.pk3 to pak3.pk3) of Star Trek Voyager: Elite\nForce 1.2 from your GOG installer, installed to\nC:\\Program Files\\Games\\lilium-voyager\\baseEF. Play Holomatch with\nlilium-voyager-git."
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/game/star_trek_voyager_elite_force"
release_notes = ["Built from linux-packages eliteforce-data-gog 1-3"]
provides = ["eliteforce-data"]
conflicts = []
replaces = []

[deps]

[files]
"lilium-voyager" = "<ProgramFiles>/Games/lilium-voyager"

[[shortcut]]
name = "Star Trek Voyager Elite Force (Lilium Voyager)"
target = "lilium-voyager/lilium-voyager.exe"
args = ""
description = "Star Trek Voyager: Elite Force Holomatch"
requires = "lilium-voyager/lilium-voyager.exe"

[stage]
container = "fedora"
source_dir = "eliteforce-data-gog"
deps = ["desktop-file-utils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/lilium-voyager"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/lilium-voyager/." "$STAGE/lilium-voyager/"
rm -f "$STAGE/lilium-voyager/.gamelaunch-stamp"
'''
