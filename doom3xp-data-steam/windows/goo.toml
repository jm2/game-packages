# GooGet (Windows) package for doom3xp-data-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "doom3xp-data-steam"
version = "0"
release = 3
arch = "noarch"
description = "Doom 3: Resurrection of Evil data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/9070/DOOM_3_Resurrection_of_Evil/"
release_notes = ["Generated from package.toml; non-interactive Steam download via STEAM_USER or tools/fetch-steam", "Require doom3-data; conflict with doom3-data-gog, which includes the expansion"]
provides = ["doom3xp-data"]
conflicts = ["doom3-data-gog"]
replaces = []

[deps]

[files]
"doom3" = "<SystemDrive>/Games/doom3"

[stage]
container = "fedora"
source_dir = "doom3xp-data-steam"
deps = ["desktop-file-utils"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/doom3"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/doom3/." "$STAGE/doom3/"
rm -f "$STAGE/doom3/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
