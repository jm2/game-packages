name = "doom3xp-data-steam"
family = "data-steam"
release = 4
summary = "Doom 3: Resurrection of Evil data via Steam"
url = "https://store.steampowered.com/app/9070/DOOM_3_Resurrection_of_Evil/"
target = "/opt/doom3"
provides = ["doom3xp-data"]
conflicts = ["doom3xp-data"]
changelog = [
  "Generated from package.toml; non-interactive Steam download via STEAM_USER or tools/fetch-steam",
  "Require doom3-data; conflict with doom3-data-gog, which includes the expansion",
  "Conflict with the virtual doom3xp-data instead of naming the other source packages, like every Doom 3 data package (Windows lists the providers by name)",
]

[source.steam]
appid = 9070
# Keeps the version above the AUR package's "1" (no epoch).
version_base = "1"
copy = ["d3xp/*.pk4"]

[deps]
arch = ["doom3-data"]
fedora = ["doom3-data"]
debian = ["doom3-data"]

[goo]
# doom3-data-gog conflicts with this package, so doom3-data-steam is the only
# real base-game package (googet cannot resolve virtual Provides in deps).
deps = ["doom3-data-steam"]

[[goo.shortcut]]
name = "Doom 3 Resurrection of Evil (dhewm3)"
target = "doom3/dhewm3_notools.exe"
args = "+set fs_game d3xp"
description = "Doom 3: Resurrection of Evil"
requires = "doom3/dhewm3_notools.exe"
