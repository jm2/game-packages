# GooGet (Windows) package for simcity4-wine-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "simcity4-gog"
version = "1.1.641"
release = 3
arch = "noarch"
description = "SimCity 4 Deluxe Edition with data via GOG"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/game/simcity_4_deluxe_edition"
release_notes = ["Built from linux-packages simcity4-wine-gog 1.1.641-3"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"simcity4" = "<SystemDrive>/Games/simcity4"

[[shortcut]]
name = "SimCity 4"
target = "simcity4/Apps/SimCity 4.exe"
args = "-CustomResolution:enabled -r1920x1080x32"
description = "SimCity 4 Deluxe Edition"

[[firewall]]
name = "SimCity 4 (SimCity 4.exe)"
program = "simcity4/Apps/SimCity 4.exe"

[stage]
container = "fedora"
source_dir = "simcity4-wine-gog"
deps = ["desktop-file-utils", "icoutils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/simcity4"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/simcity4/." "$STAGE/simcity4/"
rm -f "$STAGE/simcity4/.gamelaunch-stamp"
'''
