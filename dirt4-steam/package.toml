name = "dirt4-steam"
family = "native-steam"
id = "dirt4"
aarch64 = false   # Feral port: needs AUR-only x86 legacy libraries
release = 3
summary = "DiRT 4 (native Linux, Feral) with data via Steam"
url = "https://store.steampowered.com/app/421020/DiRT_4/"
conflicts = ["dirt4-wine-steam"]
remove_files = ["dirt4.sh"]
changelog = [
  "Switch to gamelaunch and gbe-fork-bin",
  "Declare the system libraries the game, its CEF browser and Feral helpers link (from readelf)",
]
notes = """
Feral's port needs legacy libraries (openssl 1.0, libidn11, librtmp0, gconf)
that only the AUR still provides; on Fedora/Debian install equivalents
yourself or prefer dirt4-wine-steam."""
deb = { parts = 6 }

[source.steam]
appid = 421020
platform = "linux"

[gbe]
libs = ["lib/libsteam_api.so"]

[icon]
png = "share/GameIcons/icon_512x512.png"

[install]
remove = ["config/steam-check.sh"]

[launcher]
exe = "Dirt4.sh"

[desktop]
name = "DiRT 4"
categories = "Game;SportsGame;"
keywords = "racing;rally;codemasters"

[deps]
arch = ["alsa-lib", "dbus", "expat", "fontconfig", "freetype2", "glib2", "libgcc", "libgomp", "libstdc++", "libvorbis", "nspr", "nss", "sdl2-compat", "sdl2_image", "sdl2_ttf", "zlib"]
fedora = ["alsa-lib", "dbus-libs", "expat", "fontconfig", "freetype", "glib2", "libgcc", "libgomp", "libstdc++", "libvorbis", "nspr", "nss", "nss-util", "sdl2-compat", "SDL2_image", "SDL2_ttf", "zlib-ng-compat"]
debian = ["libasound2t64", "libdbus-1-3", "libexpat1", "libfontconfig1", "libfreetype6", "libgcc-s1", "libglib2.0-0t64", "libgomp1", "libnspr4", "libnss3", "libsdl2-2.0-0", "libsdl2-image-2.0-0", "libsdl2-ttf-2.0-0", "libstdc++6", "libvorbis0a", "zlib1g"]
