# GooGet (Windows) package for codghosts-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "codghosts-steam"
version = "0"
release = 3
arch = "noarch"
description = "Call of Duty: Ghosts with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/209160/Call_of_Duty_Ghosts/"
release_notes = ["Built from linux-packages codghosts-wine-steam 0-3"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"codghosts" = "<SystemDrive>/Games/codghosts"

[writable]
dirs = ["codghosts"]

[[shortcut]]
name = "Call of Duty: Ghosts"
target = "codghosts/iw6sp64_ship.exe"
args = ""
description = "Call of Duty: Ghosts"

[[shortcut]]
name = "Call of Duty: Ghosts (multiplayer / extinction (LAN via Goldberg))"
target = "codghosts/iw6mp64_ship.exe"
args = ""
description = "Call of Duty: Ghosts"

[[firewall]]
name = "Call of Duty: Ghosts (iw6sp64_ship.exe)"
program = "codghosts/iw6sp64_ship.exe"

[[firewall]]
name = "Call of Duty: Ghosts (iw6mp64_ship.exe)"
program = "codghosts/iw6mp64_ship.exe"

[stage]
container = "fedora"
source_dir = "codghosts-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin"]
local = ["gbe-fork-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/codghosts"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/codghosts/." "$STAGE/codghosts/"
rm -f "$STAGE/codghosts/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
