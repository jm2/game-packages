name = "serioussam2-steam"
family = "native-steam"
id = "serioussam2"
native32 = true   # 32-bit x86: FEX on aarch64, box64 cannot run it
release = 2
summary = "Serious Sam 2 (flibit's Linux port) with data via Steam"
url = "https://store.steampowered.com/app/204340/Serious_Sam_2/"
remove_files = ["serioussam2.desktop"]
changelog = [
  "Generated package: non-interactive install (no steamcmd inside package(), no piped install.sh)",
  "sha256 instead of md5",
]
notes = """
Uses flibitijibibo's Linux build of Serious Sam 2 with the game data from the
Windows Steam release. It is a 32-bit game: it needs 32-bit OpenAL and
libXxf86misc. libXxf86misc is no longer packaged by Fedora or Debian (on Arch
it is lib32-libxxf86misc in the AUR)."""

[source.steam]
appid = 204340
platform = "windows"
copy = ["All_PC_0[1-3].gro", "Movies_PC_0[12].gro", "Patch_02_068.gro"]

[[source.files]]
name = "flibitSam2_2070b.tar.gz"
url = "http://www.flibitijibibo.com/fedora/installers/flibitSam2_2070b.tar.gz"
sha256 = "0b38125a80b004f47ef5ba6b3dc5cca5f8c32d73040cf31026f8ac8c159e6981"
extract = "tar"
subdir = "Install"
to = "_flibit/"

[install]
extra_paths = ["/usr/share/pixmaps/serioussam2.xpm"]

[hooks]
post_prepare = """
# What flibit's interactive install.sh does, minus the prompts.
(
    cd _flibit
    tar xjf serious.sam.2_beta_rc2.1.tar.bz2
    tar xzf sed2_help.tar.gz
    cp -r Bin Content SeriousEngineTools_Help README.flibit README.Croteam serious.sam.2.xpm ..
    cp bin/serioussam2 bin/serioussam2-editor ..
)
rm -rf _flibit
chmod 755 serioussam2 serioussam2-editor
"""
post_install = """
install -Dm644 serious.sam.2.xpm "$D/usr/share/pixmaps/serioussam2.xpm"
# The game wants libopenal.so.0; point it at the distro's 32-bit OpenAL.
for lib in /usr/lib32/libopenal.so.1 /usr/lib/i386-linux-gnu/libopenal.so.1 /usr/lib/libopenal.so.1; do
    [ -e "$lib" ] && break
done
ln -sf "$lib" libopenal.so.0
"""

[launcher]
exe = "serioussam2"
env = ["LD_LIBRARY_PATH=/opt/serioussam2"]

[deps]
arch = ["lib32-openal", "lib32-libxxf86misc"]
fedora = ["openal-soft(x86-32)"]
debian = ["libopenal1:i386"]

[desktop]
name = "Serious Sam 2"
categories = "Game;ActionGame;Shooter;"
