name = "torchlight2-gog"
family = "native-gog"
id = "torchlight2"
version = "1.25.9.7"
release = 3
summary = "Torchlight II (native Linux) with data via GOG"
url = "https://www.gog.com/game/torchlight_ii"
provides = ["torchlight2"]
remove_files = ["torchlight2.sh"]
