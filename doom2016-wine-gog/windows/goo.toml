# GooGet (Windows) package for doom2016-wine-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "doom2016-gog"
version = "20240321.110145"
release = 1
arch = "noarch"
description = "DOOM (2016) using Wine with data via GOG"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/en/game/doom_2016"
release_notes = ["Initial GOG package (replaces doom2016-wine-steam, which needed DRM-free executables)"]
provides = []
conflicts = ["doom2016-steam"]
replaces = ["doom2016-steam"]

[deps]

[files]
"doom2016" = "<SystemDrive>/Games/doom2016"

[[shortcut]]
name = "DOOM (2016)"
target = "doom2016/DOOMx64vk.exe"
args = ""
description = "DOOM (2016) (Wine)"

[[shortcut]]
name = "DOOM (2016) (OpenGL renderer)"
target = "doom2016/DOOMx64.exe"
args = ""
description = "DOOM (2016) (Wine)"

[[firewall]]
name = "DOOM (2016) (DOOMx64vk.exe)"
program = "doom2016/DOOMx64vk.exe"

[[firewall]]
name = "DOOM (2016) (DOOMx64.exe)"
program = "doom2016/DOOMx64.exe"

[stage]
container = "fedora"
source_dir = "doom2016-wine-gog"
deps = ["desktop-file-utils", "icoutils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/doom2016"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/doom2016/." "$STAGE/doom2016/"
rm -f "$STAGE/doom2016/.gamelaunch-stamp"
'''
