[icon]
ico = "goggame-*.ico"

[hooks]
post_prepare = """
# The game is at the installer root, but app/ holds a game video
# (base/video/modbot/) and the GOG icon; merge it.
if [ -d app ]; then cp -a app/. .; rm -rf app; fi
rm -rf __redist commonappdata tmp
"""

[launcher]
exe = "DOOMx64vk.exe"
umu_id = "umu-379720"
dxvk = false
legacy_dirs = ["~/.doom2016/wine"]
prereqs = ["vcrun2015|winetricks:mfc140"]
variants = [
  { flag = "v", exe = "DOOMx64vk.exe", description = "Vulkan renderer" },
  { flag = "o", exe = "DOOMx64.exe", description = "OpenGL renderer" },
]
default_variant = "v"

[desktop]
name = "DOOM (2016)"
comment = "DOOM (2016) (Wine)"
categories = "Game;ActionGame;Shooter;"
