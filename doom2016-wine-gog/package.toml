name = "doom2016-wine-gog"
family = "wine-gog"
id = "doom2016"
version = "20240321.110145"
release = 1
summary = "DOOM (2016) using Wine with data via GOG"
url = "https://www.gog.com/en/game/doom_2016"
conflicts = ["doom2016-wine-steam"]
replaces = ["doom2016-wine-steam"]
changelog = ["Initial GOG package (replaces doom2016-wine-steam, which needed DRM-free executables)"]
notes = """
The GOG build is DRM-free (campaign only; GOG does not include multiplayer or
SnapMap). `doom2016 -o` starts the OpenGL renderer; the default is Vulkan."""
deb = { parts = 9 }

