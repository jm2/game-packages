# GooGet (Windows) package for quake3-data-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "quake3-data-steam"
version = "0"
release = 4
arch = "noarch"
description = "Quake III Arena and Team Arena data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/2200/Quake_III_Arena/"
release_notes = ["Built from linux-packages quake3-data-steam 0-3"]
provides = ["quake3-data", "quake3-ta-data"]
conflicts = ["quake3-data-gog"]
replaces = ["quake3-ta-data-steam"]

[deps]

[files]
"quake3" = "<ProgramFiles>/Games/quake3"

[[shortcut]]
name = "Quake III Arena (Quake3e)"
target = "quake3/quake3e.x64.exe"
args = "+set fs_homepath \"%APPDATA%\\Quake3\""
description = "Quake III Arena"
requires = "quake3/quake3e.x64.exe"

[[shortcut]]
name = "Quake III Team Arena (Quake3e)"
target = "quake3/quake3e.x64.exe"
args = "+set fs_homepath \"%APPDATA%\\Quake3\" +set fs_game missionpack"
description = "Quake III: Team Arena"
requires = "quake3/quake3e.x64.exe"

[stage]
container = "fedora"
source_dir = "quake3-data-steam"
deps = ["desktop-file-utils", "python3"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/quake3"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/quake3/." "$STAGE/quake3/"
rm -f "$STAGE/quake3/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
