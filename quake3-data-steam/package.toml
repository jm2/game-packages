name = "quake3-data-steam"
family = "data-steam"
release = 2
summary = "Quake III Arena data via Steam"
url = "https://store.steampowered.com/app/2200/Quake_III_Arena/"
target = "/opt/quake3"
provides = ["quake3-data"]
conflicts = ["quake3-data-gog"]
changelog = [
  "Generated from package.toml; non-interactive Steam download via STEAM_USER or tools/fetch-steam",
  "Depend on quake3-pointrelease-data for the 1.32 point release paks",
]
notes = """
baseq3/pak0.pk3 for ioquake3-based engines such as quake3e. The 1.32 point
release paks (baseq3/pak1-8.pk3) come from quake3-pointrelease-data, which
this package depends on. Team Arena is quake3-ta-data-steam."""

[source.steam]
appid = 2200
# Keeps the version above the AUR package's "1" (no epoch).
version_base = "1"
copy = ["baseq3/pak0.pk3"]

[deps]
arch = ["quake3-pointrelease-data"]
fedora = ["quake3-pointrelease-data"]
debian = ["quake3-pointrelease-data"]

[goo]
# Windows-only changes (shortcuts) since the Linux release.
release_offset = 2

[[goo.shortcut]]
name = "Quake III Arena (Quake3e)"
target = "quake3/quake3e.x64.exe"
args = "+set fs_homepath \"%APPDATA%\\Quake3\""
description = "Quake III Arena"
requires = "quake3/quake3e.x64.exe"
