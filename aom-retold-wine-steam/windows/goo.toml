# GooGet (Windows) package for aom-retold-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "aom-retold-steam"
version = "0"
release = 5
arch = "noarch"
description = "Age of Mythology: Retold, run through gamelaunch\n(umu/Proton or system wine) with the game data downloaded from Steam and the\nGoldberg Steam emulator (gbe-fork-bin). ageLANServer and its launcher\ncompanion DLLs restore LAN multiplayer lobbies without the official servers."
license = "LicenseRef-Proprietary"
url = "https://steamdb.info/app/1934680/"
release_notes = ["Built from linux-packages aom-retold-wine-steam 0-5"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"aom-retold" = "<ProgramFiles>/Games/aom-retold"

[writable]
dirs = ["aom-retold"]

[[shortcut]]
name = "Age of Mythology: Retold"
target = "aom-retold/AoMRT_s.exe"
args = ""
description = "Age of Mythology: Retold"

[[firewall]]
name = "Age of Mythology: Retold (AoMRT_s.exe)"
program = "aom-retold/AoMRT_s.exe"

[stage]
container = "fedora"
source_dir = "aom-retold-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin", "python3"]
local = ["gbe-fork-bin", "agelanserver-companion-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/aom-retold"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/aom-retold/." "$STAGE/aom-retold/"
rm -f "$STAGE/aom-retold/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
