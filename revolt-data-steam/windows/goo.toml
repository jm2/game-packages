# GooGet (Windows) package for revolt-data-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "revolt-data-steam"
version = "0"
release = 1
arch = "noarch"
description = "The game files of Re-Volt (1999) from your Steam copy (app 287310), downloaded\nwith steamcmd, converted to lower-case names and installed as RVGL's\ngame_files pack in /opt/rvgl/packs/game_files. Play it with rvgl-bin."
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/287310/ReVolt/"
release_notes = ["Built from linux-packages revolt-data-steam 0-1"]
provides = ["revolt-data"]
conflicts = ["revolt-data", "revolt-data-revoltio"]
replaces = []

[deps]

[files]
"rvgl" = "<ProgramFiles>/Games/rvgl"

[stage]
container = "fedora"
source_dir = "revolt-data-steam"
deps = ["desktop-file-utils", "python3"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/rvgl/packs/game_files"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/rvgl/packs/game_files/." "$STAGE/rvgl/packs/game_files/"
rm -f "$STAGE/rvgl/packs/game_files/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
