name = "revolt-data-steam"
family = "data-steam"
release = 2
summary = "Re-Volt game data for RVGL from Steam"
description = """
The game files of Re-Volt (1999) from your Steam copy (app 287310), downloaded
with steamcmd, converted to lower-case names and installed as RVGL's
game_files pack in /opt/rvgl/packs/game_files. Play it with rvgl-bin."""
url = "https://store.steampowered.com/app/287310/ReVolt/"
target = "/opt/rvgl/packs/game_files"
provides = ["revolt-data"]
conflicts = ["revolt-data"]
changelog = ["Initial package: Steam Re-Volt (app 287310) as RVGL's game_files pack", "Conflict with the virtual revolt-data instead of naming the other source packages, like every Re-Volt data package (Windows lists the providers by name)"]
notes = """
Only the folders RVGL reads are kept: cars, edit, gallery, gfx, levels,
models and wavs (the same folders as Re-Volt I/O's game_files pack), plus the
Steam music. Steam ships the music as music/*.ogg; it is installed as
redbook/, where RVGL looks for the CD soundtrack. Steam's Windows programs,
its own settings and the Digital Extras are left out. If rvgl-soundtrack is
installed too, its music replaces Steam's (it is loaded later).

RVGL's own fixes to the original tracks and cars are in rvgl-bin's
rvgl_assets pack, which is loaded after this one.

Tested with RVGL 23.1030a1 and no other data package: RVGL loads the
frontend. Compared with revolt-data-revoltio, the Steam files lack the
reversed track variants (levels/*/reversed) and the intro's introc-j
textures."""

[source.steam]
appid = 287310

[install]
extra_paths = ["%dir /opt/rvgl", "%dir /opt/rvgl/packs"]

[deps]
optional_arch = ["rvgl-bin: the RVGL engine to play the game"]
recommends_fedora = ["rvgl-bin"]

[deb]
recommends = ["rvgl-bin"]

[hooks]
post_prepare = '''
# RVGL needs lower-case names (upstream's fix_cases does this to an install).
# Rename deepest paths first; folders that differ only in case are merged.
find . -mindepth 1 -depth -name '*[[:upper:]]*' -print0 |
while IFS= read -r -d '' f; do
    dir=${f%/*} base=${f##*/}
    lower=$dir/${base,,}
    if [ ! -e "$lower" ]; then
        mv -T -- "$f" "$lower"
    elif [ -d "$f" ] && [ -d "$lower" ]; then
        cp -a -- "$f/." "$lower/" && rm -rf -- "$f"
    else
        pt_msg2 "dropping $f: $lower exists"
        rm -rf -- "$f"
    fi
done

# Steam's music folder is RVGL's redbook (CD audio) folder.
if [ -d music ] && [ ! -e redbook ]; then mv music redbook; fi

# Keep only what RVGL reads from the original game.
for f in * .[!.]*; do
    case $f in cars|edit|gallery|gfx|levels|models|wavs|redbook) ;; *) rm -rf -- "$f" ;; esac
done
find . -type f \( -name '*.exe' -o -name '*.dll' \) -delete

for d in cars/rc gfx models wavs levels/frontend levels/nhood1; do
    [ -d "$d" ] || pt_die "the Steam download has no $d folder; RVGL can't use it as is"
done
# Plain data: nothing in the pack is executable.
find . -type f -exec chmod 644 {} +
'''

[goo]
description = """
The game files of Re-Volt (1999) from your Steam copy (app 287310), converted
to lower-case names and installed as RVGL's game_files pack in
C:\\Program Files\\Games\\rvgl\\packs\\game_files. Play it with rvgl-bin."""

[[goo.shortcut]]
name = "Re-Volt (RVGL)"
target = "rvgl/rvgl.exe"
args = "-prefpath \"%APPDATA%\\RVGL\""
description = "Re-Volt, the radio-controlled car racer, on the RVGL engine"
requires = "rvgl/rvgl.exe"
