# GooGet (Windows) package for knockoutcity-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "knockoutcity-steam"
version = "0"
release = 1
arch = "noarch"
description = "Knockout City Private Server Edition using Wine with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/2915930/Knockout_City__Private_Server_Edition/"
release_notes = ["Initial package"]
provides = ["knockoutcity-client"]
conflicts = ["knockoutcity-wine"]
replaces = []

[deps]

[files]
"knockoutcity" = "<SystemDrive>/Games/knockoutcity"

[[shortcut]]
name = "Knockout City"
target = "knockoutcity/KnockoutCity.exe"
args = ""
description = "Dodgeball brawler: host or join a LAN game (Wine)"

[[firewall]]
name = "Knockout City (KnockoutCity.exe)"
program = "knockoutcity/KnockoutCity.exe"

[stage]
container = "fedora"
source_dir = "knockoutcity-wine-steam"
deps = ["desktop-file-utils", "icoutils"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/knockoutcity"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/knockoutcity/." "$STAGE/knockoutcity/"
rm -f "$STAGE/knockoutcity/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
