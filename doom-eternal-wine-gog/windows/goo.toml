# GooGet (Windows) package for doom-eternal-wine-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "doom-eternal-gog"
version = "20260414.233123"
release = 1
arch = "noarch"
description = "DOOM Eternal with data via GOG"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/en/game/doom_eternal"
release_notes = ["Initial package"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"doom-eternal" = "<SystemDrive>/Games/doom-eternal"

[[shortcut]]
name = "DOOM Eternal"
target = "doom-eternal/DOOMEternalx64vk.exe"
args = ""
description = "DOOM Eternal"

[[firewall]]
name = "DOOM Eternal (DOOMEternalx64vk.exe)"
program = "doom-eternal/DOOMEternalx64vk.exe"

[stage]
container = "fedora"
source_dir = "doom-eternal-wine-gog"
deps = ["desktop-file-utils", "icoutils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/doom-eternal"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/doom-eternal/." "$STAGE/doom-eternal/"
rm -f "$STAGE/doom-eternal/.gamelaunch-stamp"
'''
