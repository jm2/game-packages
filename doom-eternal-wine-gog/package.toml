[icon]
ico = "goggame-*.ico"

[hooks]
post_prepare = """
# The game is at the installer root. app/ only holds GOG's icon and web cache
# (every DLC installer adds its own); keep the game's icon. The DLC installers
# only add GOG's DLC markers (goggame-<dlc id>.info/.hashdb).
mv app/goggame-1344230395.ico .
rm -rf app __redist commonappdata tmp
"""

[launcher]
exe = "DOOMEternalx64vk.exe"
umu_id = "umu-782330"
dxvk = false
legacy_dirs = []

[desktop]
name = "DOOM Eternal"
comment = "DOOM Eternal (Wine)"
categories = "Game;ActionGame;Shooter;"
