name = "aoe2-de-wine-steam"
family = "wine-steam"
id = "aoe2-de"
release = 4
summary = "Age of Empires II: DE using Wine with data via Steam, ageLANServer for LAN"
description = """
Age of Empires II: Definitive Edition (with the Enhanced Graphics Pack), run
through gamelaunch (umu/Proton or system wine) with the game data downloaded
from Steam and the Goldberg Steam emulator (gbe-fork-bin). ageLANServer and
its launcher companion DLLs restore LAN multiplayer lobbies without the
official servers."""
url = "https://steamdb.info/app/813780/"
changelog = ["Link Goldberg from /opt/gbe-fork so the game starts under umu/Proton"]
remove_files = ["lan.sh", "lan-client.sh", "lan-wine.sh", "aoe2-de-lan.conf", "aoe2-de.sh", "ColdClientLoader.ini", "configs.app.ini", "configs.user.ini",
                "achievements.json", "supported_languages.txt"]
extra_files = ["gbe.configs.app.ini", "gbe.configs.user.ini", "gbe.achievements.json",
               "gbe.supported_languages.txt", "aoe2-de-lan.desktop", "aoe2-de.agelan"]
notes = """
`aoe2-de` starts the game directly. `aoe2-de-lan` (menu entry "Age of Empires II: DE (LAN)")
runs the ageLANServer launcher from agelanserver-bin: it finds a server on the
LAN or offers to start one, then starts the game through gamelaunch with the
companion DLLs (agelanserver-companion-bin, linked into
`steam_settings/load_dlls/` and loaded by gbe-fork-bin's experimental
steam_api64.dll) pointed at the server. Joining needs no root. For hosting,
see /usr/share/doc/agelanserver-bin/README.md (the agelanserver@age2.service
system service is the easy way). 

Start `aoe2-de` once before the first LAN game: creating the Wine prefix can take
longer than the minute the launcher waits for the game to appear."""

[source.steam]
appid = 813780
depots = [[813780, 1039811]]   # Enhanced Graphics Pack


[gbe]
libs = ["steam_api64.dll"]
flavour = "experimental"   # loads steam_settings/load_dlls/*.dll (companion DLLs)

[icon]
exe = "AoE2DE_s.exe"

[deps]
arch = ["agelanserver-bin", "agelanserver-companion-bin"]
fedora = ["agelanserver-bin", "agelanserver-companion-bin"]
debian = ["agelanserver-bin", "agelanserver-companion-bin"]

[install]
remove = ["*.vdf"]
extra_paths = ["/usr/bin/aoe2-de-lan", "/usr/share/agelanserver/games/aoe2-de.conf",
               "/usr/share/applications/aoe2-de-lan.desktop"]

[launcher]
exe = "AoE2DE_s.exe"
writable = true
writable_copy = ["certificates/cacert.pem"]

[deb]
parts = 7

[hooks]
post_install = '''
# Companion DLLs (agelanserver-companion-bin), loaded by Goldberg's load_dlls.
install -d steam_settings/load_dlls
ln -sfn /usr/lib/agelanserver-companion/Age2FakeOnline.dll steam_settings/load_dlls/Age2FakeOnline.dll
ln -sfn /usr/lib/agelanserver-companion/AgeFakeHostsCerts.dll steam_settings/load_dlls/AgeFakeHostsCerts.dll
# LAN launcher entry: agelan (agelanserver-bin) reads this descriptor.
install -Dm644 "$PT_SRCDIR/aoe2-de.agelan" "$D/usr/share/agelanserver/games/aoe2-de.conf"
install -Dm644 "$PT_SRCDIR/aoe2-de-lan.desktop" "$D/usr/share/applications/aoe2-de-lan.desktop"
install -d "$D/usr/bin"
echo '#!/bin/sh' > "$D/usr/bin/aoe2-de-lan"
echo 'exec agelan aoe2-de "$@"' >> "$D/usr/bin/aoe2-de-lan"
chmod 755 "$D/usr/bin/aoe2-de-lan"
'''

[desktop]
name = "Age of Empires II: Definitive Edition"
comment = "Age of Empires II: Definitive Edition (Wine)"
categories = "Game;StrategyGame;"
keywords = "strategy;rts;"
