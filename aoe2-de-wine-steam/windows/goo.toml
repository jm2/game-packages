# GooGet (Windows) package for aoe2-de-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "aoe2-de-steam"
version = "0"
release = 5
arch = "noarch"
description = "Age of Empires II: Definitive Edition (with the Enhanced Graphics Pack), run\nthrough gamelaunch (umu/Proton or system wine) with the game data downloaded\nfrom Steam and the Goldberg Steam emulator (gbe-fork-bin). ageLANServer and\nits launcher companion DLLs restore LAN multiplayer lobbies without the\nofficial servers."
license = "LicenseRef-Proprietary"
url = "https://steamdb.info/app/813780/"
release_notes = ["Built from linux-packages aoe2-de-wine-steam 0-5"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"aoe2-de" = "<ProgramFiles>/Games/aoe2-de"

[writable]
dirs = ["aoe2-de"]

[[shortcut]]
name = "Age of Empires II: Definitive Edition"
target = "aoe2-de/AoE2DE_s.exe"
args = ""
description = "Age of Empires II: Definitive Edition"

[[firewall]]
name = "Age of Empires II: Definitive Edition (AoE2DE_s.exe)"
program = "aoe2-de/AoE2DE_s.exe"

[stage]
container = "fedora"
source_dir = "aoe2-de-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin"]
local = ["gbe-fork-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/aoe2-de"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/aoe2-de/." "$STAGE/aoe2-de/"
rm -f "$STAGE/aoe2-de/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
