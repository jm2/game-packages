# GooGet (Windows) package for quake2-data-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "quake2-data-steam"
version = "0"
release = 2
arch = "noarch"
description = "Quake II data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/2320/Quake_II/"
release_notes = ["Built from linux-packages quake2-data-steam 0-2"]
provides = ["quake2-data", "quake2-full-data"]
conflicts = ["quake2-data-gog"]
replaces = []

[deps]

[files]
"quake2" = "<ProgramFiles>/Games/quake2"

[[shortcut]]
name = "Quake II (Yamagi Quake II)"
target = "quake2/yquake2.exe"
args = ""
description = "Quake II"
requires = "quake2/yquake2.exe"

[[shortcut]]
name = "Quake II The Reckoning (Yamagi Quake II)"
target = "quake2/yquake2.exe"
args = "+set game xatrix"
description = "Quake II Mission Pack 1"
requires = "quake2/xatrix/game.dll"

[[shortcut]]
name = "Quake II Ground Zero (Yamagi Quake II)"
target = "quake2/yquake2.exe"
args = "+set game rogue"
description = "Quake II Mission Pack 2"
requires = "quake2/rogue/game.dll"

[[shortcut]]
name = "Quake II Capture the Flag (Yamagi Quake II)"
target = "quake2/yquake2.exe"
args = "+set game ctf"
description = "Threewave Capture the Flag for Quake II"
requires = "quake2/ctf/game.dll"

[stage]
container = "fedora"
source_dir = "quake2-data-steam"
deps = ["desktop-file-utils", "python3"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/quake2"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/usr/share/games/quake2/." "$STAGE/quake2/"
rm -f "$STAGE/quake2/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
