# Windows on ARM build: merged over goo.toml by tools/goo-build (see goopack.py).
arch = "arm64"
description = """
Tributary, a Rhythmbox-style media manager with unified local and remote
backends, written in Rust with GTK4 and libadwaita (upstream's self-contained
Windows ARM64 build, including GTK, GStreamer and FFmpeg)."""

[[source]]
name = "tributary-0.7.2-windows-aarch64.zip"
url = "https://github.com/jm2/tributary/releases/download/v0.7.2/tributary-windows-aarch64.zip"
sha256 = "c02b0ece970ae899f7b26554580bc5b99a85477a3d767a4af5410ef27ef351d6"

[stage]
script = '''
unzip -q -o "$SRC/tributary-0.7.2-windows-aarch64.zip" -d "$STAGE"
mv "$STAGE/tributary-windows" "$STAGE/tributary"
'''
