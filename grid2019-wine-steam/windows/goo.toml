# GooGet (Windows) package for grid2019-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "grid2019-steam"
version = "0"
release = 3
arch = "noarch"
description = "GRID (2019) using Wine with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/703860/GRID/"
release_notes = ["Link Goldberg from /opt/gbe-fork so the game starts under umu/Proton"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"grid2019" = "<SystemDrive>/Games/grid2019"

[[shortcut]]
name = "GRID (2019)"
target = "grid2019/Grid_dx12.exe"
args = ""
description = "GRID (2019) (Wine)"

[[firewall]]
name = "GRID (2019) (Grid_dx12.exe)"
program = "grid2019/Grid_dx12.exe"

[stage]
container = "fedora"
source_dir = "grid2019-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin"]
local = ["gbe-fork-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/grid2019"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/grid2019/." "$STAGE/grid2019/"
rm -f "$STAGE/grid2019/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
