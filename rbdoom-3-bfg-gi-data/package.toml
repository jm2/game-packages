name = "RBDOOM-3-BFG-1.6.0.22-full-win64-20250510-git-ba39ba6.7z"
url = "https://github.com/RobertBeckebans/RBDOOM-3-BFG/releases/download/v1.6.0/RBDOOM-3-BFG-1.6.0.22-full-win64-20250510-git-ba39ba6.7z"
sha256 = "f1b9a325cede2a281ece7d10a1a8bc48ce760d12ae23e37c62308631a886abae"
extract = "7z"
copy = ["base/_rbdoom_global_illumination_data.pk4", "base/_rbdoom_blood.pk4"]

[deps]
arch = ["rbdoom-3-bfg"]
fedora = ["rbdoom-3-bfg"]
debian = ["rbdoom-3-bfg"]

[goo]
# Windows release 2 (= 1 + 1) is above the published 1.6.0@1 (Windows
# description and rbdoom-3-bfg dependency).
release_offset = 1
deps = ["rbdoom-3-bfg"]
