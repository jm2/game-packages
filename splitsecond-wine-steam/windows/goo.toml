# GooGet (Windows) package for splitsecond-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "splitsecond-steam"
version = "0"
release = 2
arch = "noarch"
description = "Split/Second with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/297860/SplitSecond/"
release_notes = ["Built from linux-packages splitsecond-wine-steam 0-2"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"splitsecond" = "<ProgramFiles>/Games/splitsecond"

[[shortcut]]
name = "Split/Second"
target = "splitsecond/SplitSecond.exe"
args = ""
description = "Split/Second"

[[firewall]]
name = "Split/Second (SplitSecond.exe)"
program = "splitsecond/SplitSecond.exe"

[stage]
container = "fedora"
source_dir = "splitsecond-wine-steam"
deps = ["desktop-file-utils", "python3"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/splitsecond"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/splitsecond/." "$STAGE/splitsecond/"
rm -f "$STAGE/splitsecond/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
