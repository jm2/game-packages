# GooGet (Windows) package for dirtrally2-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "dirtrally2-steam"
version = "0"
release = 3
arch = "noarch"
description = "DiRT Rally 2.0 with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/690790/DiRT_Rally_20/"
release_notes = ["Built from linux-packages dirtrally2-wine-steam 0-3"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"dirtrally2" = "<SystemDrive>/Games/dirtrally2"

[[shortcut]]
name = "DiRT Rally 2.0"
target = "dirtrally2/dirtrally2.exe"
args = ""
description = "DiRT Rally 2.0"

[[firewall]]
name = "DiRT Rally 2.0 (dirtrally2.exe)"
program = "dirtrally2/dirtrally2.exe"

[stage]
container = "fedora"
source_dir = "dirtrally2-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin"]
local = ["gbe-fork-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/dirtrally2"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/dirtrally2/." "$STAGE/dirtrally2/"
rm -f "$STAGE/dirtrally2/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
