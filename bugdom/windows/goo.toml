# GooGet (Windows) package; built by tools/goo-build.
name = "bugdom"
version = "1.3.4"
release = 1
arch = "x86_64"
description = """
Bugdom, Pangea Software's 3D action-adventure starring Rollie McFly, updated
for modern systems by Iliyas Jorio (upstream's self-contained Windows x64
build, including game data, SDL2 and the MSVC runtime). Preferences and saved
games go to %APPDATA%\\Bugdom for each user."""
# Game code and assets (CC-BY-NC-SA-4.0), Pomme (MIT) and bundled SDL2.dll
# (Zlib).
license = "CC-BY-NC-SA-4.0 AND MIT AND Zlib"
url = "https://github.com/jorio/Bugdom"
release_notes = ["Initial GooGet package (upstream 1.3.4 Windows x64 build)"]

[files]
"bugdom" = "<ProgramFiles>/Games/bugdom"

[[shortcut]]
name = "Bugdom"
# FindGameData() checks <exe dir>/Data first and Pomme's GetPreferencesFolder()
# uses FOLDERID_RoamingAppData (%APPDATA%\Bugdom), and the game data ships
# inside this package, so neither path arguments nor requires are needed.
target = "bugdom/Bugdom.exe"
args = ""
description = "Save Bugdom from Thorax's evil Fire Ants"

# Upstream publishes no release digest; SHA-256 computed from the 1.3.4 asset.
[[source]]
name = "Bugdom-1.3.4-windows-x64.zip"
url = "https://github.com/jorio/Bugdom/releases/download/1.3.4/Bugdom-1.3.4-windows-x64.zip"
sha256 = "ae75d5d6ad9a4557600cd4cb4d5c8518a3b8bae0bae27fa216e4936d5a7a727d"

[stage]
# $SRC: downloaded sources; $STAGE: the tree [files] maps from.
# Drop the .pdb debug symbols, matching the stripped Linux binary package.
script = '''
unzip -q -o "$SRC/Bugdom-1.3.4-windows-x64.zip" -d "$STAGE"
mv "$STAGE/Bugdom-1.3.4" "$STAGE/bugdom"
rm -f "$STAGE/bugdom/Bugdom.pdb"
'''
