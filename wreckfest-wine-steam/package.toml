name = "wreckfest-wine-steam"
family = "wine-steam"
id = "wreckfest"
release = 5
summary = "Wreckfest using Wine with data via Steam"
url = "https://store.steampowered.com/app/228380/Wreckfest/"
remove_files = ["wreckfest.sh", "wreckfest.install"]
changelog = ["LAN: preload wine-ipv6only so hosting from the game works under Wine", "Put Goldberg under THQ's Steam wrapper instead of replacing it, so LAN play matches the GOG build"]
deb = { parts = 4 }
notes = """
LAN play: the game's top-level steam_api64.dll is THQ Nordic's online
wrapper (the same file as in the GOG build), which loads Valve's Steam API
from wrapper/THQNOnline/steam/. Goldberg replaces only that inner Steam API,
so LAN discovery and joins go through THQ's layer exactly as in the GOG
build: this package finds and joins dedicated servers run by
wreckfest-wine-gog (`wreckfest-gog -s`).

Hosting from the game (Create Server) under Wine: THQ's wrapper binds a
dual-stack IPv6 socket and then an IPv4 socket on UDP 27016. Windows allows
that, Linux refuses the second bind, and nobody can join. gamelaunch preloads
wine-ipv6only (x86_64) for the 64-bit game (`-m`, the default), which makes the
IPv6 socket IPv6-only so the IPv4 bind succeeds. The legacy 32-bit `-l` runs
without it (expect the same hosting bug there). `GAMELAUNCH_NO_PRELOAD=1`
turns it off for one run."""

[source.steam]
appid = 228380
# Keeps the version above the AUR package's "1.27" (no epoch).
version_base = "1.27"

[gbe]
# Inside THQ's wrapper, not the top-level steam_api64.dll (see notes).
libs = ["wrapper/THQNOnline/steam/steam_api64.dll", "?wrapper/THQNOnline/steam/steam_api.dll"]

[icon]
exe = "Wreckfest.exe"

[install]
remove = ["*.vdf"]

[launcher]
exe = "Wreckfest_x64.exe"
variants = [
  { flag = "m", exe = "Wreckfest_x64.exe", description = "64-bit Wreckfest_x64.exe" },
  { flag = "l", exe = "Wreckfest.exe", description = "legacy 32-bit Wreckfest.exe" },
]
default_variant = "m"
# Wine bug workaround for hosting (see notes); not for the dedicated server.
preload = ["/opt/wine-ipv6only/lib64/ipv6only.so"]
preload_variants = ["m"]

[desktop]
name = "Wreckfest"
comment = "Wreckfest (Wine)"
categories = "Game;SportsGame;"
keywords = "racing;derby"
