# GooGet (Windows) package for wreckfest-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "wreckfest-steam"
version = "0"
release = 5
arch = "noarch"
description = "Wreckfest with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/228380/Wreckfest/"
release_notes = ["LAN: preload wine-ipv6only so hosting from the game works under Wine", "Put Goldberg under THQ's Steam wrapper instead of replacing it, so LAN play matches the GOG build"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"wreckfest" = "<SystemDrive>/Games/wreckfest"

[[shortcut]]
name = "Wreckfest"
target = "wreckfest/Wreckfest_x64.exe"
args = ""
description = "Wreckfest"

[[shortcut]]
name = "Wreckfest (legacy 32-bit Wreckfest.exe)"
target = "wreckfest/Wreckfest.exe"
args = ""
description = "Wreckfest"

[[firewall]]
name = "Wreckfest (Wreckfest_x64.exe)"
program = "wreckfest/Wreckfest_x64.exe"

[[firewall]]
name = "Wreckfest (Wreckfest.exe)"
program = "wreckfest/Wreckfest.exe"

[stage]
container = "fedora"
source_dir = "wreckfest-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin"]
local = ["gbe-fork-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/wreckfest"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/wreckfest/." "$STAGE/wreckfest/"
rm -f "$STAGE/wreckfest/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
