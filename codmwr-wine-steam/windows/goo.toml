[stage]
container = "fedora"
source_dir = "codmwr-wine-steam"
deps = ["desktop-file-utils", "icoutils", "bsdtar", "gbe-fork-bin", "python3"]
local = ["gbe-fork-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/codmwr"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/codmwr/." "$STAGE/codmwr/"
rm -f "$STAGE/codmwr/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
