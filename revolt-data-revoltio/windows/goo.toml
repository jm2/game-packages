# GooGet (Windows) package for revolt-data-revoltio
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "revolt-data-revoltio"
version = "22.0909"
release = 1
arch = "noarch"
description = "The original Re-Volt (1999) game files (tracks, cars, graphics and sounds),\ndownloaded at build time from Re-Volt I/O, the community site that hosts them\nfor RVGL Launcher, and installed as RVGL's game_files pack in\n/opt/rvgl/packs/game_files. Play it with rvgl-bin."
license = "LicenseRef-Proprietary"
url = "https://re-volt.io/downloads/game"
release_notes = ["Built from linux-packages revolt-data-revoltio 22.0909-1"]
provides = ["revolt-data"]
conflicts = ["revolt-data", "revolt-data-steam"]
replaces = []

[deps]

[files]
"rvgl" = "<SystemDrive>/Games/rvgl"

[[source]]
name = "game_files-22.0909.zip"
url = "https://distribute.re-volt.io/packs/game_files.zip"
sha256 = "6ce4033dd436e37fdd37f02991ae5f5c4427a40f58e87a8ff0cb787ebb667f9f"

[stage]
container = "fedora"
source_dir = "revolt-data-revoltio"
deps = ["desktop-file-utils", "unzip"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/rvgl/packs/game_files"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/rvgl/packs/game_files/." "$STAGE/rvgl/packs/game_files/"
rm -f "$STAGE/rvgl/packs/game_files/.gamelaunch-stamp"
'''
