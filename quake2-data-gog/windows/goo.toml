# GooGet (Windows) package for quake2-data-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "quake2-data-gog"
version = "1"
release = 4
arch = "noarch"
description = "Quake II data via GOG"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/game/quake_ii_quad_damage"
release_notes = ["Generated from package.toml", "Drop conflicts with Steam packages that never existed (the mission packs ship with quake2-data-steam); provide quake2-full-data for Debian's quake2 launcher"]
provides = ["quake2-data", "quake2-full-data"]
conflicts = ["quake2-data-steam"]
replaces = []

[deps]

[files]
"quake2" = "<SystemDrive>/Games/quake2"

[stage]
container = "fedora"
source_dir = "quake2-data-gog"
deps = ["desktop-file-utils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/quake2"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/usr/share/games/quake2/." "$STAGE/quake2/"
rm -f "$STAGE/quake2/.gamelaunch-stamp"
'''
