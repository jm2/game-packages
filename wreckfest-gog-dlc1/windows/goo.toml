# GooGet (Windows) package for wreckfest-gog-dlc1
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "wreckfest-gog-dlc1"
version = "1.0o"
release = 3
arch = "noarch"
description = "Wreckfest (GOG) - Season Pass 1"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/en/game/wreckfest"
release_notes = ["Install into /opt/wreckfest-gog so the game finds the DLC", "Use GOG's file name and DLC path for the installer and pin its sha256", "Ship GOG's DLC marker files instead of webcache.zip (which conflicted)"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"wreckfest-gog" = "<SystemDrive>/Games/wreckfest-gog"

[stage]
container = "fedora"
source_dir = "wreckfest-gog-dlc1"
deps = ["desktop-file-utils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/wreckfest-gog"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/wreckfest-gog/." "$STAGE/wreckfest-gog/"
rm -f "$STAGE/wreckfest-gog/.gamelaunch-stamp"
'''
