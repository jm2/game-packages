name = "dirt4-wine-steam"
family = "wine-steam"
id = "dirt4"
release = 2
summary = "DiRT 4 using Wine with data via Steam"
url = "https://store.steampowered.com/app/421020/DiRT_4/"
conflicts = ["dirt4-steam"]
remove_files = ["dirt4.sh", "dirt4.install"]
changelog = ["Switch to gamelaunch and gbe-fork-bin"]
deb = { parts = 6 }

[source.steam]
appid = 421020
# Keeps the version above the AUR package's "1.12" (no epoch).
version_base = "1.12"

[gbe]
libs = ["steam_api64.dll"]

[icon]
exe = "dirt4.exe"

[install]
remove = ["*.vdf"]

[launcher]
exe = "dirt4.exe"

[desktop]
name = "DiRT 4"
comment = "DiRT 4 (Wine)"
categories = "Game;SportsGame;"
keywords = "racing;rally;codemasters"
