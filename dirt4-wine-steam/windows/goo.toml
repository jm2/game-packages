# GooGet (Windows) package for dirt4-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "dirt4-steam"
version = "0"
release = 3
arch = "noarch"
description = "DiRT 4 with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/421020/DiRT_4/"
release_notes = ["Built from linux-packages dirt4-wine-steam 0-3"]
provides = []
conflicts = ["dirt4-steam"]
replaces = []

[deps]

[files]
"dirt4" = "<ProgramFiles>/Games/dirt4"

[[shortcut]]
name = "DiRT 4"
target = "dirt4/dirt4.exe"
args = ""
description = "DiRT 4"

[[firewall]]
name = "DiRT 4 (dirt4.exe)"
program = "dirt4/dirt4.exe"

[stage]
container = "fedora"
source_dir = "dirt4-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin"]
local = ["gbe-fork-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/dirt4"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/dirt4/." "$STAGE/dirt4/"
rm -f "$STAGE/dirt4/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
