name = "dirt2-wine-steam"
family = "wine-steam"
id = "dirt2"
release = 4
summary = "Colin McRae: DiRT 2 using Wine with data via Steam"
description = """
Colin McRae: DiRT 2, run through gamelaunch (umu/Proton or system wine) with
the game data downloaded from Steam. Games for Windows - LIVE is replaced by
XLiveLessNess, which restores LAN multiplayer."""
url = "https://steamdb.info/app/12840/"
changelog = [
  "Switch to gamelaunch (umu/Proton default, system wine fallback)",
  "Replace the Ultimate ASI Loader xlive stub with XLiveLessNess (xlln-bin) for LAN play",
]
remove_files = ["dirt2.sh", "dirt2.install"]
notes = """
If DiRT 2 crashes on the first start, set `<directx forcedx9="true" />` in
`hardware_settings_config.xml` under `Documents/My Games/DiRT2/hardwaresettings/`
in `~/.local/share/gamelaunch/dirt2/userdata/` (or `~/Documents` for prefixes
created by the old package).

LAN play uses XLiveLessNess; `dirt2 -g` skips the launcher, which some LAN
setups need. XLLN's DiRT 2 quick-patch allows several instances on one machine."""

[source.steam]
appid = 12840

[icon]
ico = "*.ico"

[xlln]
enabled = true

[install]
remove = ["*.vdf"]

[launcher]
exe = "dirt2.exe"
prereqs = ["openal|winetricks:openal"]
variants = [
  { flag = "l", exe = "dirt2.exe", description = "start through the DiRT 2 launcher" },
  { flag = "g", exe = "dirt2_game.exe", description = "start the game directly, skipping the launcher" },
]
default_variant = "l"

[desktop]
name = "DiRT 2"
comment = "Colin McRae: DiRT 2 (Wine)"
categories = "Game;Simulation;"
keywords = "racing;rally;codemasters"
