name = "dirt2-wine-steam"
family = "wine-steam"
id = "dirt2"
release = 5
summary = "Colin McRae: DiRT 2 using Wine with data via Steam"
description = """
Colin McRae: DiRT 2, run through gamelaunch (umu/Proton or system wine) with
the game data downloaded from Steam. Games for Windows - LIVE is replaced by
XLiveLessNess, which restores LAN multiplayer."""
url = "https://steamdb.info/app/12840/"
changelog = ["Link XLiveLessNess from /opt/xlln so the game starts under umu/Proton"]
remove_files = ["dirt2.sh", "dirt2.install"]
deb = { parts = 2 }   # ~11 GB of data
notes = """
If DiRT 2 crashes on the first start, set `<directx forcedx9="true" />` in
`hardware_settings_config.xml` under `Documents/My Games/DiRT2/hardwaresettings/`
in `~/.local/share/gamelaunch/dirt2/userdata/` (or `~/Documents` for prefixes
created by the old package).

LAN play uses XLiveLessNess. XLLN's DiRT 2 quick-patch allows several
instances on one machine. (dirt2_game.exe refuses to start without the
dirt2.exe launcher, so there is no "skip the launcher" mode.)"""

[source.steam]
appid = 12840

[icon]
ico = "dirt2.ico"

[xlln]
enabled = true

[install]
remove = ["*.vdf"]

[launcher]
exe = "dirt2.exe"
# The launcher exe has its own version (0.1.0.8); version from the game.
version_exe = "dirt2_game.exe"
# Creative OpenAL from the game's own redist folder (offline, silent).
prereqs = ["openal|redist/OpenAL/OpenALwEAX.exe /s"]

[desktop]
name = "DiRT 2"
comment = "Colin McRae: DiRT 2 (Wine)"
categories = "Game;Simulation;"
keywords = "racing;rally;codemasters"
