# GooGet (Windows) package for dirt2-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "dirt2-steam"
version = "0"
release = 5
arch = "noarch"
description = "Colin McRae: DiRT 2, run through gamelaunch (umu/Proton or system wine) with\nthe game data downloaded from Steam. Games for Windows - LIVE is replaced by\nXLiveLessNess, which restores LAN multiplayer."
license = "LicenseRef-Proprietary"
url = "https://steamdb.info/app/12840/"
release_notes = ["Built from linux-packages dirt2-wine-steam 0-5"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"dirt2" = "<ProgramFiles>/Games/dirt2"

[writable]
dirs = ["dirt2"]

[[shortcut]]
name = "DiRT 2"
target = "dirt2/dirt2.exe"
args = ""
description = "Colin McRae: DiRT 2"

[[firewall]]
name = "DiRT 2 (dirt2.exe)"
program = "dirt2/dirt2.exe"

[[prereq]]
name = "openal"
path = "dirt2/redist/OpenAL/OpenALwEAX.exe"
args = "/s"

[stage]
container = "fedora"
source_dir = "dirt2-wine-steam"
deps = ["desktop-file-utils", "icoutils"]
local = ["xlln-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/dirt2"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/dirt2/." "$STAGE/dirt2/"
rm -f "$STAGE/dirt2/.gamelaunch-stamp"
mkdir -p "$STAGE/dirt2/XLiveLessNess"
cp -L /opt/xlln/xlive.dll "$STAGE/dirt2/"
cp -aL /opt/xlln/XLiveLessNess/. "$STAGE/dirt2/XLiveLessNess/"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
