# GooGet (Windows) package for aoe3-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "aoe3-steam"
version = "0"
release = 3
arch = "noarch"
description = "Age of Empires III (2007) Complete Collection with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/105450/Age_of_Empires_III_2007/"
release_notes = ["Switch to gamelaunch (umu/Proton default, system wine fallback)"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"aoe3" = "<SystemDrive>/Games/aoe3"

[[shortcut]]
name = "Age of Empires III (Age of Empires III (original game))"
target = "aoe3/age3.exe"
args = "+noIntroCinematics"
description = "Age of Empires III Complete Collection"

[[shortcut]]
name = "Age of Empires III (The WarChiefs)"
target = "aoe3/age3x.exe"
args = "+noIntroCinematics"
description = "Age of Empires III Complete Collection"

[[shortcut]]
name = "Age of Empires III"
target = "aoe3/age3y.exe"
args = "+noIntroCinematics"
description = "Age of Empires III Complete Collection"

[[firewall]]
name = "Age of Empires III (age3.exe)"
program = "aoe3/age3.exe"

[[firewall]]
name = "Age of Empires III (age3x.exe)"
program = "aoe3/age3x.exe"

[[firewall]]
name = "Age of Empires III (age3y.exe)"
program = "aoe3/age3y.exe"

[stage]
container = "fedora"
source_dir = "aoe3-wine-steam"
deps = ["desktop-file-utils"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/aoe3"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/aoe3/." "$STAGE/aoe3/"
rm -f "$STAGE/aoe3/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
