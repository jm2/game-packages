name = "doom3-data-gog"
family = "data-gog"
version = "1.3.1"
release = 1
summary = "Doom 3 and Resurrection of Evil data via GOG"
url = "https://www.gog.com/game/doom_3"
target = "/opt/doom3"
provides = ["doom3-data", "doom3xp-data"]
conflicts = ["doom3-data-steam", "doom3xp-data-steam"]
changelog = ["Initial package"]
notes = """
GOG's original DOOM 3 (doom_3_classic, part of the DOOM 3 bundle) includes
Resurrection of Evil, so this package installs both base/*.pk4 and
d3xp/*.pk4 for dhewm3 and other Doom 3 engines."""

