# GooGet (Windows) package for doom3-data-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "doom3-data-gog"
version = "1.3.1"
release = 4
arch = "noarch"
description = "Doom 3 and Resurrection of Evil data via GOG"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/game/doom_3"
release_notes = ["Built from linux-packages doom3-data-gog 1.3.1-4"]
provides = ["doom3-data", "doom3xp-data"]
conflicts = ["doom3-data-steam", "doom3xp-data-steam"]
replaces = []

[deps]

[files]
"doom3" = "<ProgramFiles>/Games/doom3"

[[shortcut]]
name = "Doom 3 (dhewm3)"
target = "doom3/dhewm3_notools.exe"
args = ""
description = "Doom 3"
requires = "doom3/dhewm3_notools.exe"

[[shortcut]]
name = "Doom 3 Resurrection of Evil (dhewm3)"
target = "doom3/dhewm3_notools.exe"
args = "+set fs_game d3xp"
description = "Doom 3: Resurrection of Evil"
requires = "doom3/dhewm3_notools.exe"

[stage]
container = "fedora"
source_dir = "doom3-data-gog"
deps = ["desktop-file-utils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/doom3"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/doom3/." "$STAGE/doom3/"
rm -f "$STAGE/doom3/.gamelaunch-stamp"
'''
