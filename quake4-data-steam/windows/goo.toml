# GooGet (Windows) package for quake4-data-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "quake4-data-steam"
version = "0"
release = 2
arch = "noarch"
description = "Quake 4 data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/2210/Quake_IV/"
release_notes = ["Generated from package.toml; non-interactive Steam download via STEAM_USER or tools/fetch-steam"]
provides = ["quake4-data"]
conflicts = ["quake4-data-gog"]
replaces = []

[deps]

[files]
"quake4" = "<SystemDrive>/Games/quake4"

[stage]
container = "fedora"
source_dir = "quake4-data-steam"
deps = ["desktop-file-utils"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/quake4"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/quake4/." "$STAGE/quake4/"
rm -f "$STAGE/quake4/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
