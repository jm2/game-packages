name = "gridautosport-steam"
family = "native-steam"
id = "gridautosport"
aarch64 = false   # Feral port: needs AUR-only x86 legacy libraries
release = 4
summary = "GRID Autosport (native Linux, Feral) with data via Steam"
url = "https://steamdb.info/app/255220/"
remove_files = ["gridautosport.sh"]
changelog = [
  "Switch to gamelaunch and gbe-fork-bin",
  "Declare the system libraries the game, its CEF browser and Feral helpers link (from readelf)",
]
notes = """
Feral's port needs legacy libraries (openssl 1.0, libidn11, librtmp0, gconf)
that only the AUR still provides; on Fedora/Debian install equivalents
yourself."""
deb = { disabled = "the game needs libidn11, librtmp0, OpenLDAP 2.4 and GConf, which current Fedora and Debian do not ship" }
rpm = { disabled = "the game needs libidn11, librtmp0, OpenLDAP 2.4 and GConf, which current Fedora and Debian do not ship" }

[source.steam]
appid = 255220
platform = "linux"

[gbe]
libs = ["lib/x86_64/libsteam_api.so"]

[icon]
png = "share/icons/GameIcon_512x512x32.png"

[hooks]
post_install = """
sed -i '/steam-check.sh/d' GridAutosport.sh
"""

[launcher]
exe = "GridAutosport.sh"

[desktop]
name = "GRID Autosport"
categories = "Game;SportsGame;"
keywords = "racing;codemasters"

[deps]
arch = ["alsa-lib", "cairo", "dbus", "expat", "fontconfig", "freetype2", "gconf", "glib2", "krb5", "libcap", "libcups", "libgcc", "libidn11", "libldap24", "librtmp0", "libstdc++", "libvorbis", "libx11", "libxcomposite", "libxcursor", "libxdamage", "libxext", "libxfixes", "libxi", "libxrandr", "libxrender", "libxtst", "nspr", "nss", "pango", "sdl2-compat", "sdl2_image", "util-linux-libs", "zlib"]
