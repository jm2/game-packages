name = "doom3bfg-data-steam"
family = "data-steam"
release = 4
summary = "Doom 3 BFG Edition data via Steam"
url = "https://store.steampowered.com/app/208200/Doom_3_BFG_Edition/"
target = "/usr/share/games/doom3bfg"
provides = ["doom3bfg-data"]
conflicts = ["doom3bfg-data"]
changelog = ["Generated from package.toml; non-interactive Steam download via STEAM_USER or tools/fetch-steam", "Conflict with the virtual doom3bfg-data instead of naming the other source packages, like every Doom 3 BFG data package (Windows lists the providers by name)", "Rebuilt without set-group-ID bits on its directories, which made RPM refuse to install it beside its engine package"]

[source.steam]
appid = 208200
# Keeps the version above the AUR package's "1" (no epoch).
version_base = "1"
copy = ["base"]

[[goo.shortcut]]
name = "Doom 3 BFG Edition (RBDOOM-3-BFG)"
target = "doom3bfg/RBDoom3BFG.exe"
args = ""
description = "Doom 3 BFG Edition"
requires = "doom3bfg/RBDoom3BFG.exe"
