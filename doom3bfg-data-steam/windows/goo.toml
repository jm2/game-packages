# GooGet (Windows) package for doom3bfg-data-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "doom3bfg-data-steam"
version = "0"
release = 2
arch = "noarch"
description = "Doom 3 BFG Edition data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/208200/Doom_3_BFG_Edition/"
release_notes = ["Generated from package.toml; non-interactive Steam download via STEAM_USER or tools/fetch-steam"]
provides = ["doom3bfg-data"]
conflicts = ["doom3bfg-data-gog"]
replaces = []

[deps]

[files]
"doom3bfg" = "<SystemDrive>/Games/doom3bfg"

[stage]
container = "fedora"
source_dir = "doom3bfg-data-steam"
deps = ["desktop-file-utils"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/doom3bfg"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/usr/share/games/doom3bfg/." "$STAGE/doom3bfg/"
rm -f "$STAGE/doom3bfg/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
