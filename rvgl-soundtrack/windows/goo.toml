# GooGet (Windows) package for rvgl-soundtrack
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "rvgl-soundtrack"
version = "20.1008"
release = 2
arch = "noarch"
description = "The original Re-Volt soundtrack (based on the Dreamcast version) as Ogg\nVorbis files, installed as RVGL's soundtrack pack in\nC:\\Program Files\\Games\\rvgl\\packs\\soundtrack and downloaded at build time\nfrom Re-Volt I/O. Needs rvgl-bin and a Re-Volt data package."
license = "LicenseRef-Proprietary"
url = "https://rvgl.org"
release_notes = ["Built from linux-packages rvgl-soundtrack 20.1008-1"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"rvgl" = "<ProgramFiles>/Games/rvgl"

[[source]]
name = "soundtrack-20.1008.zip"
url = "https://distribute.re-volt.io/packs/soundtrack.zip"
sha256 = "472259107349e7af549ff859cc7ffcf347f56786e5e63ecf7e1ffa761a152bf8"

[stage]
container = "fedora"
source_dir = "rvgl-soundtrack"
deps = ["desktop-file-utils", "unzip"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/rvgl/packs/soundtrack"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/rvgl/packs/soundtrack/." "$STAGE/rvgl/packs/soundtrack/"
rm -f "$STAGE/rvgl/packs/soundtrack/.gamelaunch-stamp"
'''
