name = "dirtrally-steam"
family = "native-steam"
id = "dirtrally"
aarch64 = false   # Feral port: needs AUR-only x86 legacy libraries
release = 3
summary = "DiRT Rally (native Linux, Feral) with data via Steam"
url = "https://steamdb.info/app/310560/"
remove_files = ["dirtrally.sh"]
changelog = [
  "Switch to gamelaunch and gbe-fork-bin",
  "Declare the system libraries the game, its CEF browser and Feral helpers link (from readelf)",
]
notes = """
Feral's port needs legacy libraries (openssl 1.0, libidn11, librtmp0, gconf)
that only the AUR still provides; on Fedora/Debian install equivalents
yourself."""
deb = { parts = 5 }   # ~40 GiB of data

[source.steam]
appid = 310560
platform = "linux"

[gbe]
libs = ["lib/x86_64/libsteam_api.so"]

[icon]
png = "share/GameIcons/icon_512x512.png"

[hooks]
post_install = """
sed -i '/steam-check.sh/d' DirtRally.sh
"""

[launcher]
exe = "DirtRally.sh"

[desktop]
name = "DiRT Rally"
categories = "Game;SportsGame;"
keywords = "racing;codemasters"

[deps]
arch = ["alsa-lib", "cairo", "dbus", "e2fsprogs", "expat", "fontconfig", "freetype2", "gconf", "glib2", "krb5", "libcap", "libcups", "libgcc", "libgomp", "libidn11", "libldap24", "librtmp0", "libstdc++", "libvorbis", "libx11", "libxcomposite", "libxcursor", "libxdamage", "libxext", "libxfixes", "libxi", "libxrandr", "libxrender", "libxtst", "nspr", "nss", "openssl-1.0", "pango", "sdl2-compat", "sdl2_image", "sdl2_ttf", "zlib"]
fedora = ["alsa-lib", "cairo", "cups-libs", "dbus-libs", "expat", "fontconfig", "freetype", "GConf2", "glib2", "krb5-libs", "libcap", "libcom_err", "libgcc", "libgomp", "libstdc++", "libvorbis", "libX11", "libXcomposite", "libXcursor", "libXdamage", "libXext", "libXfixes", "libXi", "libXrandr", "libXrender", "libXtst", "nspr", "nss", "nss-util", "openldap-compat", "pango", "sdl2-compat", "SDL2_image", "SDL2_ttf", "zlib-ng-compat"]
debian = ["libasound2t64", "libcairo2", "libcap2", "libcom-err2", "libcups2t64", "libdbus-1-3", "libexpat1", "libfontconfig1", "libfreetype6", "libgcc-s1", "libglib2.0-0t64", "libgomp1", "libgssapi-krb5-2", "libk5crypto3", "libkrb5-3", "libnspr4", "libnss3", "libpango-1.0-0", "libpangocairo-1.0-0", "libsdl2-2.0-0", "libsdl2-image-2.0-0", "libsdl2-ttf-2.0-0", "libstdc++6", "libvorbis0a", "libx11-6", "libxcomposite1", "libxcursor1", "libxdamage1", "libxext6", "libxfixes3", "libxi6", "libxrandr2", "libxrender1", "libxtst6", "zlib1g"]
