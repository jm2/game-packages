# GooGet (Windows) package for rvgl-dcpack
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "rvgl-dcpack"
version = "23.0501a1"
release = 1
arch = "noarch"
description = "The content of the Dreamcast version of Re-Volt for RVGL: the Rooftops track\nand 14 additional cars (including BigVolt and BossVolt), with the Dreamcast\ncar selection layout. Installed as RVGL's rvgl_dcpack pack in\n/opt/rvgl/packs/rvgl_dcpack, downloaded at build time from Re-Volt I/O."
license = "LicenseRef-Proprietary"
url = "https://rvgl.org"
release_notes = ["Initial package: rvgl_dcpack 23.0501a1"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"rvgl" = "<SystemDrive>/Games/rvgl"

[[source]]
name = "rvgl_dcpack-23.0501a1.zip"
url = "https://distribute.re-volt.io/packs/rvgl_dcpack.zip"
sha256 = "db2414cd14c44adae24021beb3f00dfe8605833255291aa43062f68916544d36"

[stage]
container = "fedora"
source_dir = "rvgl-dcpack"
deps = ["desktop-file-utils", "unzip"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/rvgl/packs/rvgl_dcpack"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/rvgl/packs/rvgl_dcpack/." "$STAGE/rvgl/packs/rvgl_dcpack/"
rm -f "$STAGE/rvgl/packs/rvgl_dcpack/.gamelaunch-stamp"
'''
