name = "quake3-ta-data-steam"
family = "data-steam"
release = 1
summary = "Quake III: Team Arena data via Steam"
url = "https://store.steampowered.com/app/2350/Quake_III_Team_Arena/"
target = "/opt/quake3"
provides = ["quake3-ta-data"]
conflicts = ["quake3-data-gog"]
changelog = ["Generated from package.toml; non-interactive Steam download via STEAM_USER or tools/fetch-steam"]
notes = """
missionpack/pak0.pk3 for ioquake3-based engines; needs quake3-data."""

[source.steam]
appid = 2350
# Keeps the version above the AUR package's "1" (no epoch).
version_base = "1"
copy = ["missionpack/pak0.pk3"]

[deps]
arch = ["quake3-data"]
fedora = ["quake3-data"]
debian = ["quake3-data"]

[goo]
# Windows-only changes (shortcuts) since the Linux release.
release_offset = 1

[[goo.shortcut]]
name = "Quake III Team Arena (Quake3e)"
target = "quake3/quake3e.x64.exe"
args = "+set fs_homepath \"%APPDATA%\\Quake3\" +set fs_game missionpack"
description = "Quake III: Team Arena"
requires = "quake3/quake3e.x64.exe"
