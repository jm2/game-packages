name = "broforce-steam"
family = "native-steam"
id = "broforce"
release = 3
summary = "Broforce (native Linux) with data via Steam"
url = "https://store.steampowered.com/app/274190/Broforce/"
provides = ["broforce"]
conflicts = ["broforce-gog"]
remove_files = ["broforce.sh"]
changelog = [
  "Switch to gamelaunch; saves go to a per-user overlay instead of a world-writable /opt/broforce",
  "Declare glib2, which the Unity player links",
]

[source.steam]
appid = 274190
# Keeps the version above the AUR package's "1130_20201008" (no epoch).
version_base = "1130.20201008"
platform = "linux"

[icon]
png = "Broforce_Data/Resources/UnityPlayer.png"

[launcher]
exe = "Broforce.x86_64"
writable = true
variants = [
  { flag = "m", exe = "Broforce.x86_64", description = "64-bit build" },
  { flag = "l", exe = "Broforce.x86", description = "legacy 32-bit build" },
]
default_variant = "m"

[desktop]
name = "Broforce"
categories = "Game;ActionGame;"

[deps]
arch = ["glib2", "libgl", "libx11", "libxext"]
fedora = ["glib2", "mesa-libGL", "libX11", "libXext"]
debian = ["libglib2.0-0t64", "libgl1", "libx11-6", "libxext6"]
