# GooGet (Windows) package for prey-data-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "prey-data-steam"
version = "0"
release = 3
arch = "noarch"
description = "Prey (2006) data via Steam"
license = "LicenseRef-Proprietary"
url = "https://steamdb.info/app/3970/"
release_notes = ["Built from linux-packages prey-data-steam 0-3"]
provides = ["prey-data"]
conflicts = []
replaces = []

[deps]

[files]
"prey" = "<ProgramFiles>/Games/prey"

[stage]
container = "fedora"
source_dir = "prey-data-steam"
deps = ["desktop-file-utils"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/prey"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/prey/." "$STAGE/prey/"
rm -f "$STAGE/prey/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
