name = "prey-data-steam"
version = "0"
release = 5
arch = "noarch"
description = "The retail base/*.pk4 files of Prey (2006) from your Steam copy (app 3970),\ninstalled to C:\\Program Files\\Games\\prey\\base. Play it with prey2006-git."
license = "LicenseRef-Proprietary"
url = "https://steamdb.info/app/3970/"
release_notes = ["Built from linux-packages prey-data-steam 0-4"]
provides = ["prey-data"]
conflicts = []
replaces = []

[deps]

[files]
"prey" = "<ProgramFiles>/Games/prey"

[[shortcut]]
name = "Prey (Prey2006)"
target = "prey/prey06.exe"
args = ""
description = "Prey (2006)"
requires = "prey/prey06.exe"

[stage]
container = "fedora"
source_dir = "prey-data-steam"
deps = ["desktop-file-utils", "python3"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/prey"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/prey/." "$STAGE/prey/"
rm -f "$STAGE/prey/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
