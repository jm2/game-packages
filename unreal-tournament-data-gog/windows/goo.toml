# GooGet (Windows) package for unreal-tournament-data-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "unreal-tournament-data-gog"
version = "436"
release = 5
arch = "noarch"
description = "Game data for Unreal Tournament: Game of the Year Edition, extracted from the\nGOG installer you download yourself and installed to\nC:\\Program Files\\Games\\unreal-tournament. Play it with\nunreal-tournament-bin."
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/game/unreal_tournament_goty"
release_notes = ["Built from linux-packages unreal-tournament-data-gog 436-4"]
provides = ["unreal-tournament-data"]
conflicts = ["unreal-tournament-data-archiveorg", "unreal-tournament-data-steam"]
replaces = []

[deps]

[files]
"unreal-tournament" = "<ProgramFiles>/Games/unreal-tournament"

[[shortcut]]
name = "Unreal Tournament (OldUnreal)"
target = "unreal-tournament/System/UnrealTournament.exe"
args = "-SETHOMEDIR=\"%APPDATA%\\UnrealTournament\\System\""
description = "Unreal Tournament: Game of the Year Edition"
requires = "unreal-tournament/System/UnrealTournament.exe"

[stage]
container = "fedora"
source_dir = "unreal-tournament-data-gog"
deps = ["desktop-file-utils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/unreal-tournament"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/unreal-tournament/." "$STAGE/unreal-tournament/"
rm -f "$STAGE/unreal-tournament/.gamelaunch-stamp"
'''
