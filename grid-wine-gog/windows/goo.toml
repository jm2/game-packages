# GooGet (Windows) package for grid-wine-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "grid-gog"
version = "1.3"
release = 2
arch = "noarch"
description = "Race Driver GRID (2008) with data via GOG"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/game/race_driver_grid"
release_notes = ["Built from linux-packages grid-wine-gog 1.3-2"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"grid" = "<SystemDrive>/Games/grid"

[[shortcut]]
name = "Race Driver: GRID"
target = "grid/GRID.exe"
args = ""
description = "Race Driver GRID"

[[firewall]]
name = "Race Driver: GRID (GRID.exe)"
program = "grid/GRID.exe"

[stage]
container = "fedora"
source_dir = "grid-wine-gog"
deps = ["desktop-file-utils", "icoutils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/grid"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/grid/." "$STAGE/grid/"
rm -f "$STAGE/grid/.gamelaunch-stamp"
'''
