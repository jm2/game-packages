# GooGet (Windows) package for dirt3-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "dirt3-steam"
version = "0"
release = 3
arch = "noarch"
description = "DiRT 3 Complete Edition with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://steamdb.info/app/321040/"
release_notes = ["Built from linux-packages dirt3-wine-steam 0-3"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"dirt3" = "<ProgramFiles>/Games/dirt3"

[[shortcut]]
name = "DiRT 3"
target = "dirt3/dirt3_game.exe"
args = ""
description = "DiRT 3 Complete Edition"

[[firewall]]
name = "DiRT 3 (dirt3_game.exe)"
program = "dirt3/dirt3_game.exe"

[stage]
container = "fedora"
source_dir = "dirt3-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin"]
local = ["gbe-fork-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/dirt3"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/dirt3/." "$STAGE/dirt3/"
rm -f "$STAGE/dirt3/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
