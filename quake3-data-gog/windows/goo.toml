# GooGet (Windows) package for quake3-data-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "quake3-data-gog"
version = "1"
release = 5
arch = "noarch"
description = "Quake III Arena and Team Arena data via GOG"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/game/quake_iii_gold"
release_notes = ["Built from linux-packages quake3-data-gog 1-5"]
provides = ["quake3-data", "quake3-ta-data"]
conflicts = ["quake3-data-steam", "quake3-ta-data-steam"]
replaces = []

[deps]

[files]
"quake3" = "<ProgramFiles>/Games/quake3"

[stage]
container = "fedora"
source_dir = "quake3-data-gog"
deps = ["desktop-file-utils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/quake3"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/quake3/." "$STAGE/quake3/"
rm -f "$STAGE/quake3/.gamelaunch-stamp"
'''
