[stage]
container = "fedora"
source_dir = "enemy-territory-data-etlegacy"
deps = ["desktop-file-utils", "unzip"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/enemy-territory"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/usr/share/enemy-territory/." "$STAGE/enemy-territory/"
rm -f "$STAGE/enemy-territory/.gamelaunch-stamp"
'''
