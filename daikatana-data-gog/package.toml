name = "daikatana-data-gog"
family = "data-gog"
version = "1"
release = 3
summary = "Daikatana data via GOG"
url = "https://www.gog.com/en/game/daikatana"
target = "/opt/daikatana"
provides = ["daikatana-data"]
conflicts = ["daikatana-data-steam"]
changelog = ["Generated from package.toml"]

[icon]
ico = "app/goggame-*.ico"
name = "daikatana"

[install]
remove = ["app"]

[hooks]
post_prepare = """
# Superseded by the Daikatana 1.3 patch files (the engine is not packaged here).
cd data
rm -f aidata.vsc mapnames.vsc models/e1/e1decoinfo.csv models/e2/e2decoinfo.csv \
      models/e3/e3decoinfo.csv models/e4/e4decoinfo.csv monstersounds.vsc \
      multiplayermaps.vsc multiplayermaps2.vsc music/E3B.mp3 music/music.vsc \
      sidekickambient.vsc sounds/e1/m_mwguard.vsc weapons.vsc
"""

[[source.files]]
name = "setup_daikatana_1.0_(22142).exe"
url = "gogdownloader://daikatana/en1installer0"
sha256 = "3ba8e369af573a142ea2689d4003f2eb441e9395d484a65f29fcb41ba95e26ec"
extract = "inno"
copy = ["data", "app/goggame-*.ico"]
