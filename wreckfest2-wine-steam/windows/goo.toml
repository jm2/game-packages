cp -aL "$WORK/root/opt/wreckfest2/." "$STAGE/wreckfest2/"
rm -f "$STAGE/wreckfest2/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
