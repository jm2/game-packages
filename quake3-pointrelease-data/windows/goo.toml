# GooGet (Windows) package for quake3-pointrelease-data
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "quake3-pointrelease-data"
version = "1.32b"
release = 1
arch = "noarch"
description = "The data files of id Software's Quake III Arena 1.32 point release:\nbaseq3/pak1.pk3 to pak8.pk3 and missionpack/pak1.pk3 to pak3.pk3, installed\nto /opt/quake3 next to the retail pak0.pk3 files of the quake3-data packages.\nPure servers require them. They are unpacked from id's Linux point release\ninstaller (linuxq3apoint-1.32b-3.x86.run) without running it."
license = "LicenseRef-Quake3-PointRelease-EULA"
url = "https://ftp.gwdg.de/pub/misc/ftp.idsoftware.com/idstuff/quake3/linux/"
release_notes = ["Initial package: 1.32 point release paks from id's Linux installer"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"quake3" = "<SystemDrive>/Games/quake3"

[[source]]
name = "linuxq3apoint-1.32b-3.x86.run"
url = "https://ftp.gwdg.de/pub/misc/ftp.idsoftware.com/idstuff/quake3/linux/linuxq3apoint-1.32b-3.x86.run"
sha256 = "c36132c5556b35e01950f1e9c646235033a5130f87ad776ba2bc7becf4f4f186"

[stage]
container = "fedora"
source_dir = "quake3-pointrelease-data"
deps = ["desktop-file-utils", "tar", "gzip"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/quake3"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/quake3/." "$STAGE/quake3/"
rm -f "$STAGE/quake3/.gamelaunch-stamp"
'''
