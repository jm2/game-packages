name = "simcity-3000-gog"
family = "native-gog"
id = "simcity3000"
version = "2.0"
native32 = true   # 32-bit x86: FEX on aarch64, box64 cannot run it
release = 4
summary = "SimCity 3000 Unlimited (Loki Linux port) with data via GOG"
url = "https://www.gog.com/game/simcity_3000"
remove_files = ["simcity3000.sh", "simcity3000.install"]
changelog = [
  "Generated package; launcher via gamelaunch",
  "Pin the liflg 2.0a patch archive to a commit instead of a branch",
  "Update to GOG's 2.0.949(A) ddrawfix installer (build 77026)",
]
notes = """
Runs Loki's native SimCity 3000 Unlimited 2.0a with the GOG data. Sound uses
OSS: enable the OSS proxy daemon with `sudo systemctl enable --now osspd`.
`apps/sc3u.exe` is GOG's patched Windows executable (unused by the Linux
binary, but it allows higher resolutions if you run the game under Wine).
libSimBABld.so is removed because it breaks startup; the building architect
tool may not work."""

[[source.files]]
name = "setup_simcity_3000_unlimited_2.0.949(a)_ddrawfix_(77026).exe"
url = "gogdownloader://simcity_3000/en1installer0"
sha256 = "3114106862113c1a0a9fb642e9c0c44507ec509b383b596546be4f2e99e127d0"
extract = "inno"

[[source.files]]
name = "SC3U.zip"
url = "https://files.gog.com/support/SC3U.zip"
sha256 = "122fd83f099c80929cbdc3602a3155d448b7f8879f632583060e61144c553b33"
extract = "zip"
to = "_sc3u/"

[[source.files]]
name = "sc3-lnx-support.tar.bz2"
url = "https://github.com/jm2/archlinux-package-simcity-3000-gog/raw/master/sc3-lnx-support.tar.bz2"
sha256 = "c55292c7bd183b8fc54b6c7e0ec9c53fc3657e759603cc5a174d83803b288de0"
extract = "tar"
subdir = "sc3-lnx-support"
to = "_lnx/"

[[source.files]]
name = "loki_compat_libs-1.5.tar.bz2"
url = "http://www.improbability.net/loki/loki_compat_libs-1.5.tar.bz2"
sha256 = "60932597d4ee94f0b629d7194774c2b9ce867f9519887d85e98eea84577c0e46"
extract = "tar"

[[source.files]]
name = "sc3u_2.0a-multilingual_x86-836250321b03ae4ef2496cc86aed22d479873473.zip"
url = "https://github.com/liflg/sc3u_2.0a-multilingual_x86/archive/836250321b03ae4ef2496cc86aed22d479873473.zip"
sha256 = "21e55b8f68a23252bac00e2f231fd51db02ab3a8c1b0afdde44ea78c34b2269a"
extract = "zip"
subdir = "sc3u_2.0a-multilingual_x86-836250321b03ae4ef2496cc86aed22d479873473/data"
to = "_liflg/"

[icon]
ico = "goggame-*.ico"

[hooks]
post_prepare = """
# GOG installer support files and the Windows language switcher.
rm -rf app __redist commonappdata tmp language_setup.*
lc() { # lowercase the last path component
    local b=${1##*/} d=${1%/*} l
    l=$(printf '%s' "$b" | tr 'A-Z' 'a-z')
    [ "$b" = "$l" ] || mv "$1" "$d/$l"
}
# The Loki binary expects lower-case names (it was a case-insensitive CD layout).
for f in ./*; do case $f in ./_*|./goggame-*|./Loki_Compat) ;; *) lc "$f" ;; esac; done
for f in apps/*; do lc "$f"; done
find apps/res apps/sys apps/barender apps/bacustom -depth -mindepth 1 | while read -r f; do lc "$f"; done
find cities -depth -mindepth 1 -type d | while read -r f; do lc "$f"; done
mv cities/TUTORIAL.SC3 cities/Tutorial.sc3
for f in cities/scenarios/*.SNR; do mv "$f" "${f%.SNR}.snr"; done

cp _liflg/*.sh .
ln -s apps/bacustom apps/barender apps/res apps/sys .
mv apps/sc3u.exe apps/sc3u.exe.orig
cp _sc3u/SC3U.exe apps/sc3u.exe
mkdir -p apps/res/sound/radio/stations
cp _lnx/sc3u.ini .
cp _lnx/sys-gog-paths-fixed.pak apps/sys/sys.pak
cp _lnx/csattrib_korea.ixf apps/res/sprites/
cp _lnx/occupantattribs_korea.ixf apps/res/occupant/
cp _lnx/audio.ini apps/res/sound/
cp _lnx/3kg2.xa apps/res/sound/music/
tar xf _liflg/patch-2.0a.tar
rm -f lib/libSimBABld.so
rm -rf _sc3u _lnx _liflg
"""

[launcher]
exe = "sc3u.dynamic.sh"
args = ["-w", "-intro:off"]

[deps]
arch = ["ossp"]
fedora = ["osspd"]
debian = ["osspd"]

[desktop]
name = "SimCity 3000 Unlimited"
categories = "Game;Simulation;"
