# Windows on ARM build: merged over goo.toml by tools/goo-build (see goopack.py).
arch = "arm64"
description = """
crossdock publishes, and optionally serves, one pile of package artifacts as
signed static apt, pacman, RPM, GooGet and Munki repositories, from a single Go binary
(upstream's Windows ARM64 build).
crossdock.exe is added to the system PATH; nothing runs at install."""

[[source]]
name = "crossdock-v0.3.0-windows-arm64.zip"
url = "https://github.com/jm2/crossdock/releases/download/v0.3.0/crossdock-v0.3.0-windows-arm64.zip"
sha256 = "54e4590ed827fba6d9af5cf585270f477982aa7095f2ecc5094507ef3e798c7a"

[stage]
script = '''
unzip -q -o "$SRC/crossdock-v0.3.0-windows-arm64.zip" -d "$STAGE"
mv "$STAGE/crossdock-v0.3.0-windows-arm64" "$STAGE/crossdock"
'''
