# GooGet (Windows) package; built by tools/goo-build.
name = "crossdock"
version = "0.3.0"
release = 1
arch = "x86_64"
description = """
crossdock publishes, and optionally serves, one pile of package artifacts as
signed static apt, pacman, RPM, GooGet and Munki repositories, from a single Go binary
(upstream's Windows x86_64 build).
crossdock.exe is added to the system PATH; nothing runs at install."""
license = "GPL-3.0-or-later"
url = "https://github.com/jm2/crossdock"
release_notes = ["Upstream 0.3.0: Munki repositories, browseable index pages, signed SHA256SUMS per repo"]
path = ["crossdock"]

[files]
"crossdock" = "<ProgramFiles>/crossdock"

[[source]]
name = "crossdock-v0.3.0-windows-amd64.zip"
url = "https://github.com/jm2/crossdock/releases/download/v0.3.0/crossdock-v0.3.0-windows-amd64.zip"
sha256 = "a98da4e4a77653f4e4b87fd1c27868256e57016f127025197603cca946adb110"

[stage]
script = '''
unzip -q -o "$SRC/crossdock-v0.3.0-windows-amd64.zip" -d "$STAGE"
mv "$STAGE/crossdock-v0.3.0-windows-amd64" "$STAGE/crossdock"
'''
