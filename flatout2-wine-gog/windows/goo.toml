# GooGet (Windows) package for flatout2-wine-gog
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "flatout2-gog"
version = "1.2"
release = 5
arch = "noarch"
description = "FlatOut 2 with data via GOG"
license = "LicenseRef-Proprietary"
url = "https://www.gog.com/game/flatout_2"
release_notes = ["Built from linux-packages flatout2-wine-gog 1.2-5"]
provides = []
conflicts = ["flatout2-steam"]
replaces = []

[deps]

[files]
"flatout2" = "<SystemDrive>/Games/flatout2"

[[shortcut]]
name = "FlatOut 2"
target = "flatout2/FlatOut2.exe"
args = ""
description = "FlatOut 2"

[[firewall]]
name = "FlatOut 2 (FlatOut2.exe)"
program = "flatout2/FlatOut2.exe"

[stage]
container = "fedora"
source_dir = "flatout2-wine-gog"
deps = ["desktop-file-utils", "icoutils", "innoextract"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/flatout2"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/flatout2/." "$STAGE/flatout2/"
rm -f "$STAGE/flatout2/.gamelaunch-stamp"
'''
