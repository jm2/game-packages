# GooGet (Windows) package for codaw-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "codaw-steam"
version = "0"
release = 3
arch = "noarch"
description = "Call of Duty: Advanced Warfare using Wine with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/209650/Call_of_Duty_Advanced_Warfare__Gold_Edition/"
release_notes = ["Link Goldberg from /opt/gbe-fork so the game starts under umu/Proton"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"codaw" = "<SystemDrive>/Games/codaw"

[writable]
dirs = ["codaw"]

[[shortcut]]
name = "Call of Duty: Advanced Warfare"
target = "codaw/s1_sp64_ship.exe"
args = ""
description = "Call of Duty: Advanced Warfare (Wine)"

[[shortcut]]
name = "Call of Duty: Advanced Warfare (multiplayer / exo survival (LAN via Goldberg))"
target = "codaw/s1_mp64_ship.exe"
args = ""
description = "Call of Duty: Advanced Warfare (Wine)"

[[firewall]]
name = "Call of Duty: Advanced Warfare (s1_sp64_ship.exe)"
program = "codaw/s1_sp64_ship.exe"

[[firewall]]
name = "Call of Duty: Advanced Warfare (s1_mp64_ship.exe)"
program = "codaw/s1_mp64_ship.exe"

[stage]
container = "fedora"
source_dir = "codaw-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin"]
local = ["gbe-fork-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/codaw"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/codaw/." "$STAGE/codaw/"
rm -f "$STAGE/codaw/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
