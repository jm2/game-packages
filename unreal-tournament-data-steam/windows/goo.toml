# GooGet (Windows) package for unreal-tournament-data-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "unreal-tournament-data-steam"
version = "0"
release = 4
arch = "noarch"
description = "Game data for Unreal Tournament: Game of the Year Edition, downloaded from\nSteam with steamcmd and installed to /opt/unreal-tournament. Play it with\nthe native OldUnreal binaries from unreal-tournament-bin."
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/13240/Unreal_Tournament_Game_of_the_Year_Edition/"
release_notes = ["Built from linux-packages unreal-tournament-data-steam 0-4"]
provides = ["unreal-tournament-data"]
conflicts = ["unreal-tournament-data"]
replaces = []

[deps]

[files]
"unreal-tournament" = "<ProgramFiles>/Games/unreal-tournament"

[stage]
container = "fedora"
source_dir = "unreal-tournament-data-steam"
deps = ["desktop-file-utils", "python3"]
local = []
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/unreal-tournament"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/unreal-tournament/." "$STAGE/unreal-tournament/"
rm -f "$STAGE/unreal-tournament/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
