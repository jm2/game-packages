# GooGet (Windows) package; built by tools/goo-build.
name = "quake3e"
version = "2026.10.14"
release = 8
arch = "x86_64"
description = """
Improved Quake III Arena engine with OpenGL and Vulkan renderers (upstream's
Windows build), installed next to the Quake III Arena data packages. Settings,
demos and screenshots go to %APPDATA%\\Quake3 for each user.

Install the game data too: quake3-data-steam or quake3-data-gog, plus
quake3-pointrelease-data."""
license = "GPL-2.0-or-later"
url = "https://github.com/ec-/Quake3e"
release_notes = ["Initial GooGet package (upstream 2026-10-14 Windows x86_64 build)", "Per-user settings in %APPDATA%\\Quake3; firewall rules limited to the local subnet", "Install to C:\\Program Files\\Games\\quake3", "Tested with googet 3.4.1 on Windows 11", "No dependency on quake3-data: googet 3.4.1 fails on dependencies satisfied through Provides; install a data package yourself", "Shortcuts only for installed games (Team Arena needs its data: quake3-data-steam or quake3-data-gog)", "Upgrades remove shortcuts for games whose data is missing"]

[files]
"quake3" = "<ProgramFiles>/Games/quake3"

[[shortcut]]
name = "Quake III Arena (Quake3e)"
target = "quake3/quake3e.x64.exe"
# Quake3e's Windows build keeps settings in the install dir, shared by every
# user; give each user their own (the shell expands %APPDATA% in shortcuts).
args = "+set fs_homepath \"%APPDATA%\\Quake3\""
description = "Quake III Arena"
# The data packages create these when they're installed after quake3e.
requires = "quake3/baseq3/pak0.pk3"

[[shortcut]]
name = "Quake III Team Arena (Quake3e)"
target = "quake3/quake3e.x64.exe"
args = "+set fs_homepath \"%APPDATA%\\Quake3\" +set fs_game missionpack"
description = "Quake III: Team Arena"
requires = "quake3/missionpack/pak0.pk3"

[[firewall]]
name = "Quake3e"
program = "quake3/quake3e.x64.exe"

[[firewall]]
name = "Quake3e dedicated server"
program = "quake3/quake3e.ded.x64.exe"

[[source]]
name = "quake3e-windows-x86_64-2026-10-14.zip"
url = "https://github.com/ec-/Quake3e/releases/download/2026-10-14/quake3e-windows-x86_64.zip"
sha256 = "33cc1017bf48de2b1256f74e063387e6e3b8507de309622a0e082c5b9b58279b"

[stage]
# $SRC: downloaded sources; $STAGE: the tree [files] maps from.
script = '''
mkdir -p "$STAGE/quake3"
unzip -q -o "$SRC/quake3e-windows-x86_64-2026-10-14.zip" -d "$STAGE/quake3"
'''
