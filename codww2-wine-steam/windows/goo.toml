# GooGet (Windows) package for codww2-wine-steam
# Generated by tools/gen.py from package.toml - edit package.toml instead.
name = "codww2-steam"
version = "0"
release = 3
arch = "noarch"
description = "Call of Duty: WWII using Wine with data via Steam"
license = "LicenseRef-Proprietary"
url = "https://store.steampowered.com/app/476600/Call_of_Duty_WWII/"
release_notes = ["Link Goldberg from /opt/gbe-fork so the game starts under umu/Proton"]
provides = []
conflicts = []
replaces = []

[deps]

[files]
"codww2" = "<SystemDrive>/Games/codww2"

[writable]
dirs = ["codww2"]

[[shortcut]]
name = "Call of Duty: WWII"
target = "codww2/s2_sp64_ship.exe"
args = ""
description = "Call of Duty: WWII (Wine)"

[[shortcut]]
name = "Call of Duty: WWII (multiplayer / nazi zombies (LAN via Goldberg))"
target = "codww2/s2_mp64_ship.exe"
args = ""
description = "Call of Duty: WWII (Wine)"

[[firewall]]
name = "Call of Duty: WWII (s2_sp64_ship.exe)"
program = "codww2/s2_sp64_ship.exe"

[[firewall]]
name = "Call of Duty: WWII (s2_mp64_ship.exe)"
program = "codww2/s2_mp64_ship.exe"

[stage]
container = "fedora"
source_dir = "codww2-wine-steam"
deps = ["desktop-file-utils", "icoutils", "gbe-fork-bin"]
local = ["gbe-fork-bin"]
script = '''
export PT_SRCDIR="$PKGDIR" PT_WORK="$WORK"
bash "$PKGDIR/build.sh" prepare
bash "$PKGDIR/build.sh" install "$WORK/root"
mkdir -p "$STAGE/codww2"
# Windows needs real files: follow the gbe-fork / xlln links.
cp -aL "$WORK/root/opt/codww2/." "$STAGE/codww2/"
rm -f "$STAGE/codww2/.gamelaunch-stamp"
bash "$PKGDIR/build.sh" version > "$STAGE/.version"
'''
