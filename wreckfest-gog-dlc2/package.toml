name = "wreckfest-gog-dlc2"
family = "data-gog"
version = "1.0o"
release = 3
summary = "Wreckfest (GOG) - Season Pass 2"
url = "https://www.gog.com/en/game/wreckfest"
target = "/opt/wreckfest-gog"
changelog = [
  "Install into /opt/wreckfest-gog so the game finds the DLC",
  "Use GOG's file name and DLC path for the installer and pin its sha256",
  "Ship GOG's DLC marker files instead of webcache.zip (which conflicted)",
]

[deps]
arch = ["wreckfest-wine-gog"]
fedora = ["wreckfest-wine-gog"]
debian = ["wreckfest-wine-gog"]

[[source.files]]
name = "setup_wreckfest_-_season_pass_2_1.0o_(79627).exe"
url = "gogdownloader://wreckfest/wreckfest_season_pass_2/en1installer0"
sha256 = "0a0ee95fbd0d2c33a3b6035be2424711625dd5fb055498d527ec421babe8d3c1"
extract = "inno"

[hooks]
post_prepare = """
# The DLC content is in the base game; the installer only adds GOG's DLC
# marker (goggame-<dlc id>.info/.hashdb). Keep that, and drop the installer
# files the base game package also ships (webcache.zip).
if [ -d app ]; then cp -a app/. .; rm -rf app; fi
rm -rf __redist commonappdata tmp webcache.zip goggame-*.ico
"""
